<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 10단계 화살촉 끼우기</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .88);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }
    #scene { position: fixed; inset: 0; z-index: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .83) 0%, rgba(13, 20, 18, .5) 31%, transparent 62%),
        linear-gradient(0deg, rgba(11, 17, 15, .76), transparent 36%, rgba(11, 17, 15, .26));
    }
    #interface { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .topbar {
      position: absolute;
      top: 26px;
      left: clamp(24px, 4.2vw, 66px);
      right: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font: 19px Georgia, serif;
    }
    .brand-copy { display: grid; gap: 3px; }
    .brand-copy small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .brand-copy strong { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      backdrop-filter: blur(12px);
    }
    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font: 12px Georgia, serif;
    }
    .intro {
      position: absolute;
      top: clamp(145px, 25vh, 220px);
      left: clamp(44px, 7vw, 112px);
      width: min(480px, 40vw);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }
    .eyebrow::before { width: 24px; height: 1px; background: var(--gold); content: ""; }
    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(34px, 3.5vw, 49px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.35;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }
    h1 em { color: #d9c294; font-style: normal; }
    #instruction {
      min-height: 48px;
      margin: 18px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }
    .gesture-note { display: flex; align-items: center; gap: 11px; margin-top: 24px; color: #a7ad9e; font-size: 11px; }
    .cut-icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-size: 14px;
    }
    .bottom-area { position: absolute; right: 24px; bottom: 30px; left: 24px; display: flex; justify-content: center; }
    .progress-card {
      width: min(520px, 100%);
      padding: 17px 21px 15px;
      border: 1px solid rgba(221, 204, 163, .22);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
    }
    .progress-head, .progress-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .progress-title { display: flex; align-items: center; gap: 9px; color: #e5dfce; font-size: 12px; font-weight: 600; }
    .progress-mark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .45);
      border-radius: 50%;
      color: var(--gold);
      font: 11px Georgia, serif;
    }
    #progress-value { color: #f1d5a5; font: 19px Georgia, serif; }
    .progress-track { height: 7px; margin: 12px 0 10px; overflow: hidden; border-radius: 8px; background: rgba(231, 220, 191, .12); }
    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #849e6d, #d2ae6b);
      box-shadow: 0 0 14px rgba(212, 174, 105, .35);
      transition: width .25s ease;
    }
    .progress-label { color: #aeb3a4; font-size: 10px; letter-spacing: .02em; }
    #progress-state { color: #d4bd8e; white-space: nowrap; }
    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }
    #complete-screen.is-visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .96);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s;
    }
    #complete-screen.is-visible .complete-card { transform: translateY(0) scale(1); }
    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }
    .complete-kicker { margin: 0 0 9px; color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .2em; }
    .complete-card h2 { margin: 0; font: 500 31px "Batang", "Nanum Myeongjo", serif; letter-spacing: -.06em; }
    .complete-copy { margin: 12px 0 25px; color: #b8bbae; font-size: 12px; line-height: 1.8; }
    .complete-actions { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
    .action-button {
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-button:hover { border-color: rgba(231, 215, 180, .6); background: rgba(255, 255, 255, .05); }
    .action-button.primary { border-color: var(--gold); background: var(--gold); color: #20231c; }
    .action-button.primary:hover { border-color: #e8c88f; background: #e8c88f; }
    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }
    #load-error.is-visible { display: grid; }
  </style>
</head>
<body>
  <div id="scene" aria-label="화살촉을 끼우는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>
  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy"><small>HANDCRAFT WORKSHOP</small><strong>대나무 공방</strong></div>
      </div>
      <div class="stage-chip"><b>10</b><span>10단계 · 화살촉 끼우기</span></div>
    </header>
    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 10 &nbsp; / &nbsp; ARROWHEAD FITTING</p>
      <h1>화살촉을 끼워<br><em>화살을 완성하세요</em></h1>
      <p id="instruction">완성된 화살을 클릭해 화살촉 쪽을 확대하세요.</p>
      <div class="gesture-note"><span class="cut-icon" aria-hidden="true">↗</span><span>화살촉을 드래그해 앞에 붙이고 다섯 번 클릭하세요</span></div>
    </section>
    <section class="bottom-area" aria-live="polite">
      <div class="progress-card">
        <div class="progress-head">
          <div class="progress-title"><span class="progress-mark" aria-hidden="true">Ⅹ</span><span>화살촉 끼우기</span></div>
          <strong id="progress-value">0%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="화살촉 끼우기 진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <div class="progress-label"><span id="progress-hint">화살을 클릭해 화살촉 쪽을 확대하세요</span><span id="progress-state">0 / 5회</span></div>
      </div>
    </section>
    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 10 COMPLETE</p>
        <h2 id="complete-title">10단계 완료</h2>
        <p class="complete-copy">화살촉을 다섯 번 두드려 화살대에 끼웠습니다.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">10단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">11단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
  </main>
  <div id="load-error" role="alert">3D 장면을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요.</div>
  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";
        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const progressValue = document.getElementById("progress-value");
        const progressFill = document.getElementById("progress-fill");
        const progressTrack = document.querySelector(".progress-track");
        const progressHint = document.getElementById("progress-hint");
        const progressState = document.getElementById("progress-state");
        const completionScreen = document.getElementById("complete-screen");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);
        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);
        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));
        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);
        const table = new THREE.Group();
        scene.add(table);
        const tableColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < tableColors.length; index += 1) {
          const plank = new THREE.Mesh(
            new THREE.BoxGeometry(9.7, 0.2, 0.97),
            new THREE.MeshStandardMaterial({ color: tableColors[index], roughness: 0.83 })
          );
          plank.position.set(0, 0.46, -1.94 + index * 0.97);
          plank.receiveShadow = true;
          table.add(plank);
        }
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.23, 1.15, 0.23), legMaterial);
            leg.position.set(x, -0.115, z);
            table.add(leg);
          }
        }

        const tableTop = 0.56;
        const bambooLength = 3.5;
        const bambooStart = -bambooLength / 2 + bambooLength / 12;
        const bambooEnd = bambooLength / 2 - bambooLength / 12;
        const shaftLength = bambooEnd - bambooStart;
        const shaftRadius = 0.044;
        const inkBandWidth = 0.045;
        const inkCenters = [0.24, shaftLength - 0.24];
        const nockLength = shaftLength / 10;
        const arrow = new THREE.Group();
        arrow.position.set(-1.25, tableTop + 0.0575, 0.45);
        const horizontalQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
        arrow.quaternion.copy(horizontalQuaternion);
        scene.add(arrow);

        const bambooMaterial = new THREE.MeshStandardMaterial({ color: 0x8eaa67, roughness: 0.48, metalness: 0.02 });
        const glueMaterial = new THREE.MeshStandardMaterial({ color: 0x89502d, roughness: 0.72 });
        const inkMaterial = new THREE.MeshStandardMaterial({ color: 0x12130f, roughness: 0.88 });
        const threadMaterial = new THREE.MeshStandardMaterial({ color: 0xf3efe4, roughness: 0.68, metalness: 0.02 });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 32, 1), bambooMaterial);
        shaft.position.y = shaftLength / 2;
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        arrow.add(shaft);
        const tipEnd = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        tipEnd.position.y = 0;
        tipEnd.castShadow = true;
        arrow.add(tipEnd);
        const nockEnd = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        nockEnd.position.y = shaftLength;
        nockEnd.visible = false;
        arrow.add(nockEnd);
        const coatingBounds = [
          [0, inkCenters[0] - inkBandWidth / 2],
          [inkCenters[1] + inkBandWidth / 2, shaftLength]
        ];
        for (const [start, end] of coatingBounds) {
          const coating = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, end - start, 32, 1),
            glueMaterial
          );
          coating.position.y = (start + end) / 2;
          coating.castShadow = true;
          coating.receiveShadow = true;
          arrow.add(coating);
        }
        for (const y of inkCenters) {
          const band = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.045, inkBandWidth, 24), inkMaterial);
          band.position.y = y;
          band.castShadow = true;
          arrow.add(band);
        }
        for (const [start, end] of coatingBounds) {
          const center = (start + end) / 2;
          const points = [];
          const loops = 4;
          for (let index = 0; index <= 128; index += 1) {
            const amount = index / 128;
            const angle = amount * loops * Math.PI * 2;
            points.push(new THREE.Vector3(
              Math.sin(angle) * 0.0515,
              start + (end - start) * amount,
              Math.cos(angle) * 0.0515
            ));
          }
          const thread = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 128, 0.006, 8, false),
            threadMaterial
          );
          thread.castShadow = true;
          thread.receiveShadow = true;
          arrow.add(thread);
        }

        const nockGroup = new THREE.Group();
        const nockCenterY = shaftLength + nockLength / 2 - 0.08;
        nockGroup.position.y = nockCenterY;
        arrow.add(nockGroup);
        const nockMaterial = new THREE.MeshStandardMaterial({ color: 0xd8c18d, roughness: 0.76 });
        const nockBody = new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius, shaftRadius, nockLength, 28, 1), nockMaterial);
        nockBody.castShadow = true;
        nockBody.receiveShadow = true;
        nockGroup.add(nockBody);
        const nockGlue = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.045, nockLength / 2, 24, 1),
          glueMaterial
        );
        nockGlue.position.y = -nockLength / 4;
        nockGlue.castShadow = true;
        nockGroup.add(nockGlue);
        const notchVertices = [];
        const notchIndices = [];
        const notchColumns = 12;
        const notchRows = 12;
        for (let row = 0; row <= notchRows; row += 1) {
          const y = nockLength / 2 - 0.095 * row / notchRows;
          for (let column = 0; column <= notchColumns; column += 1) {
            const x = -0.025 + 0.05 * column / notchColumns;
            const z = Math.sqrt(Math.max(0, shaftRadius * shaftRadius - x * x)) + 0.001;
            notchVertices.push(x, y, z);
          }
        }
        for (let row = 0; row < notchRows; row += 1) {
          for (let column = 0; column < notchColumns; column += 1) {
            const a = row * (notchColumns + 1) + column;
            const b = a + notchColumns + 1;
            notchIndices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }
        const notchGeometry = new THREE.BufferGeometry();
        notchGeometry.setAttribute("position", new THREE.Float32BufferAttribute(notchVertices, 3));
        notchGeometry.setIndex(notchIndices);
        notchGeometry.computeVertexNormals();
        const notch = new THREE.Mesh(
          notchGeometry,
          new THREE.MeshStandardMaterial({ color: 0x34251a, roughness: 0.95, side: THREE.DoubleSide })
        );
        nockGroup.add(notch);

        const initialHeadPosition = -0.26;
        const droppedHeadPosition = 0.005;
        const hitStep = 0.01;
        const requiredHits = 5;
        const fittedHeadPosition = droppedHeadPosition + hitStep * requiredHits;
        const headRadius = shaftRadius * 1.16;
        const arrowheadLength = 0.34;
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0x718082, roughness: 0.27, metalness: 0.82 });
        const headProfile = [
          new THREE.Vector2(0, -arrowheadLength),
          new THREE.Vector2(0.009, -arrowheadLength + 0.012),
          new THREE.Vector2(0.0225, -0.29),
          new THREE.Vector2(0.0355, -0.235),
          new THREE.Vector2(headRadius * 0.82, -0.17),
          new THREE.Vector2(headRadius, -0.025),
          new THREE.Vector2(headRadius * 0.94, 0),
          new THREE.Vector2(0, 0)
        ];
        const arrowHead = new THREE.Group();
        arrowHead.position.set(0, initialHeadPosition, 0);
        arrow.add(arrowHead);
        const headMesh = new THREE.Mesh(new THREE.LatheGeometry(headProfile, 32), headMaterial);
        headMesh.castShadow = true;
        headMesh.receiveShadow = true;
        arrowHead.add(headMesh);

        const laidCameraPosition = new THREE.Vector3(0, 4.5, 8.8);
        const laidCameraTarget = new THREE.Vector3(0, 0.95, 0);
        const closeCameraTarget = new THREE.Vector3(arrow.position.x - 0.3, arrow.position.y + 0.08, arrow.position.z);
        const closeCameraPosition = closeCameraTarget.clone().add(new THREE.Vector3(0, 0.3, 1.95));
        const cameraTarget = laidCameraTarget.clone();
        const pointer = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const pointerWorld = new THREE.Vector3();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -arrow.position.z);

        let phase = "laid";
        let hitCount = 0;
        let animationStartedAt = 0;
        let zoomTimeout = 0;
        let dragOffsetY = 0;
        let isDraggingHead = false;

        camera.position.copy(laidCameraPosition);
        camera.lookAt(cameraTarget);

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        function updateProgress() {
          const percent = Math.round(hitCount / requiredHits * 100);
          progressValue.textContent = `${percent}%`;
          progressFill.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(percent));
          if (phase === "laid") {
            instruction.textContent = "완성된 화살을 클릭해 화살촉 쪽을 확대하세요.";
            progressHint.textContent = "화살을 클릭해 화살촉 쪽을 확대하세요";
            progressState.textContent = `${hitCount} / ${requiredHits}회`;
          } else if (phase === "turning") {
            instruction.textContent = "오늬 반대쪽 끝으로 가까이 이동합니다.";
            progressHint.textContent = "화살촉 장착 위치를 확대하는 중";
            progressState.textContent = `${hitCount} / ${requiredHits}회`;
          } else if (phase === "head-ready") {
            instruction.textContent = "화살촉을 화살대 앞쪽에 드래그해 붙이세요.";
            progressHint.textContent = "화살촉을 화살대 앞에 맞춰 드랍하세요";
            progressState.textContent = `${hitCount} / ${requiredHits}회`;
          } else if (phase === "head-dragging") {
            instruction.textContent = "화살촉을 화살대 끝에 맞춰 드랍하세요.";
            progressHint.textContent = "화살촉을 앞쪽으로 옮기는 중";
            progressState.textContent = `${hitCount} / ${requiredHits}회`;
          } else if (phase === "tap-ready") {
            instruction.textContent = "화살촉을 다섯 번 클릭해 화살대에 박으세요.";
            progressHint.textContent = "클릭할 때마다 화살촉이 조금씩 들어갑니다";
            progressState.textContent = `${hitCount} / ${requiredHits}회`;
          } else {
            instruction.textContent = "화살촉이 단단히 끼워졌습니다.";
            progressHint.textContent = "화살촉 장착 완료";
            progressState.textContent = `${requiredHits} / ${requiredHits}회`;
          }
        }

        function updatePointer(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          raycaster.setFromCamera(pointer, camera);
        }

        function getArrowLocalPointerPoint() {
          arrow.updateMatrixWorld(true);
          if (!raycaster.ray.intersectPlane(dragPlane, pointerWorld)) return null;
          return arrow.worldToLocal(pointerWorld.clone());
        }

        function finishZoom() {
          if (phase !== "turning") return;
          camera.position.copy(closeCameraPosition);
          cameraTarget.copy(closeCameraTarget);
          camera.lookAt(cameraTarget);
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          phase = "head-ready";
          renderer.render(scene, camera);
          updateProgress();
        }

        function finishHeadDrop(event, cancelled) {
          if (!isDraggingHead) return;
          isDraggingHead = false;
          if (renderer.domElement.hasPointerCapture(event.pointerId)) {
            renderer.domElement.releasePointerCapture(event.pointerId);
          }
          if (!cancelled && arrowHead.position.y >= droppedHeadPosition - 0.08) {
            arrowHead.position.set(0, droppedHeadPosition, 0);
            tipEnd.visible = false;
            phase = "tap-ready";
          } else {
            arrowHead.position.set(0, initialHeadPosition, 0);
            tipEnd.visible = true;
            phase = "head-ready";
          }
          updateProgress();
          renderer.domElement.style.cursor = "default";
        }

        function resetStage() {
          phase = "laid";
          hitCount = 0;
          animationStartedAt = 0;
          window.clearTimeout(zoomTimeout);
          isDraggingHead = false;
          arrowHead.position.set(0, initialHeadPosition, 0);
          tipEnd.visible = true;
          camera.position.copy(laidCameraPosition);
          cameraTarget.copy(laidCameraTarget);
          camera.lookAt(cameraTarget);
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          completionScreen.classList.remove("is-visible");
          renderer.domElement.style.cursor = "default";
          renderer.render(scene, camera);
          updateProgress();
        }

        renderer.domElement.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          updatePointer(event);
          if (phase === "laid" && raycaster.intersectObject(arrow, true).length > 0) {
            phase = "turning";
            animationStartedAt = window.performance.now();
            zoomTimeout = window.setTimeout(finishZoom, 1100);
            updateProgress();
            event.preventDefault();
            return;
          }
          if (phase === "head-ready") {
            const hit = raycaster.intersectObject(arrowHead, true)[0];
            if (!hit) return;
            arrow.updateMatrixWorld(true);
            dragPlane.constant = -(arrow.position.z + arrowHead.position.z);
            const localHit = arrow.worldToLocal(hit.point.clone());
            dragOffsetY = arrowHead.position.y - localHit.y;
            isDraggingHead = true;
            phase = "head-dragging";
            renderer.domElement.setPointerCapture(event.pointerId);
            renderer.domElement.style.cursor = "grabbing";
            updateProgress();
            event.preventDefault();
            return;
          }
          if (phase === "tap-ready" && raycaster.intersectObject(arrowHead, true).length > 0) {
            hitCount += 1;
            arrowHead.position.y = Math.min(
              droppedHeadPosition + hitStep * hitCount,
              fittedHeadPosition
            );
            if (hitCount >= requiredHits) {
              phase = "complete";
              completionScreen.classList.add("is-visible");
            }
            updateProgress();
            event.preventDefault();
          }
        });

        renderer.domElement.addEventListener("pointermove", (event) => {
          updatePointer(event);
          if (isDraggingHead && phase === "head-dragging") {
            const localPoint = getArrowLocalPointerPoint();
            if (localPoint) {
              arrowHead.position.y = THREE.MathUtils.clamp(
                localPoint.y + dragOffsetY,
                initialHeadPosition - 0.18,
                droppedHeadPosition + 0.1
              );
            }
            renderer.domElement.style.cursor = "grabbing";
            event.preventDefault();
            return;
          }
          if (phase === "laid") {
            renderer.domElement.style.cursor = raycaster.intersectObject(arrow, true).length > 0 ? "pointer" : "default";
          } else if (phase === "head-ready") {
            renderer.domElement.style.cursor = raycaster.intersectObject(arrowHead, true).length > 0 ? "grab" : "default";
          } else if (phase === "tap-ready") {
            renderer.domElement.style.cursor = raycaster.intersectObject(arrowHead, true).length > 0 ? "pointer" : "default";
          } else {
            renderer.domElement.style.cursor = "default";
          }
        });

        renderer.domElement.addEventListener("pointerup", (event) => finishHeadDrop(event, false));
        renderer.domElement.addEventListener("pointercancel", (event) => finishHeadDrop(event, true));
        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage11.html";
        });
        window.addEventListener("resize", resize);
        camera.position.copy(laidCameraPosition);
        camera.lookAt(cameraTarget);
        resize();
        updateProgress();
        renderer.setAnimationLoop(() => {
          if (phase === "turning") {
            const amount = Math.min((window.performance.now() - animationStartedAt) / 1050, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            camera.position.lerpVectors(laidCameraPosition, closeCameraPosition, eased);
            cameraTarget.lerpVectors(laidCameraTarget, closeCameraTarget, eased);
            camera.lookAt(cameraTarget);
            if (amount >= 1) finishZoom();
          }
          renderer.render(scene, camera);
        });
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the arrowhead-fitting stage could not start.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
