<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 11단계 깃 준비하기</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .9);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }
    #scene { position: fixed; inset: 0; z-index: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .86), rgba(13, 20, 18, .38) 36%, transparent 68%),
        linear-gradient(0deg, rgba(11, 17, 15, .76), transparent 38%, rgba(11, 17, 15, .22));
    }
    #interface { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .topbar {
      position: absolute;
      top: 26px;
      right: clamp(24px, 4.2vw, 66px);
      left: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font: 19px Georgia, serif;
    }
    .brand-copy { display: grid; gap: 3px; }
    .brand-copy small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .brand-copy strong { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      backdrop-filter: blur(12px);
    }
    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font: 12px Georgia, serif;
    }
    .intro {
      position: absolute;
      top: clamp(145px, 25vh, 220px);
      left: clamp(44px, 7vw, 112px);
      width: min(460px, 39vw);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }
    .eyebrow::before { width: 24px; height: 1px; background: var(--gold); content: ""; }
    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(34px, 3.5vw, 49px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.35;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }
    h1 em { color: #d9c294; font-style: normal; }
    #instruction {
      min-height: 48px;
      margin: 18px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }
    .gesture-note { display: flex; align-items: center; gap: 11px; margin-top: 24px; color: #a7ad9e; font-size: 11px; }
    .gesture-mark {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-size: 14px;
    }
    .bottom-area { position: absolute; right: 24px; bottom: 30px; left: 24px; display: flex; justify-content: center; }
    .progress-card {
      width: min(520px, 100%);
      padding: 17px 21px 15px;
      border: 1px solid rgba(221, 204, 163, .22);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
    }
    .progress-head, .progress-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .progress-title { display: flex; align-items: center; gap: 9px; color: #e5dfce; font-size: 12px; font-weight: 600; }
    .progress-mark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .45);
      border-radius: 50%;
      color: var(--gold);
      font: 11px Georgia, serif;
    }
    #progress-value { color: #f1d5a5; font: 19px Georgia, serif; }
    .progress-track { height: 7px; margin: 12px 0 10px; overflow: hidden; border-radius: 8px; background: rgba(231, 220, 191, .12); }
    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #849e6d, #d2ae6b);
      box-shadow: 0 0 14px rgba(212, 174, 105, .35);
      transition: width .16s ease;
    }
    .progress-label { color: #aeb3a4; font-size: 10px; letter-spacing: .02em; }
    #progress-state { color: #d4bd8e; white-space: nowrap; }
    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }
    #complete-screen.is-visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .96);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s;
    }
    #complete-screen.is-visible .complete-card { transform: translateY(0) scale(1); }
    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }
    .complete-kicker { margin: 0 0 9px; color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .2em; }
    .complete-card h2 { margin: 0; font: 500 31px "Batang", "Nanum Myeongjo", serif; letter-spacing: -.06em; }
    .complete-copy { margin: 12px 0 25px; color: #b8bbae; font-size: 12px; line-height: 1.8; }
    .complete-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
    .action-button {
      min-height: 44px;
      padding: 0 20px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-button:hover { border-color: rgba(231, 215, 180, .6); background: rgba(255, 255, 255, .05); }
    .action-button.primary { border-color: rgba(215, 173, 108, .6); background: rgba(215, 173, 108, .14); color: #f0dfbd; }
    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }
    #load-error.is-visible { display: grid; }
  </style>
</head>
<body>
  <div id="scene" aria-label="뒤쪽 화살과 앞쪽 깃털의 깃대를 분리하는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>
  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy"><small>HANDCRAFT WORKSHOP</small><strong>대나무 공방</strong></div>
      </div>
      <div class="stage-chip"><b>11</b><span>11단계 · 깃 준비하기</span></div>
    </header>
    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 11 &nbsp; / &nbsp; FEATHER PREPARATION</p>
      <h1>깃대를 털에서<br><em>분리하세요</em></h1>
      <p id="instruction">옆에 놓인 깃털을 클릭해 앞으로 가져오세요.</p>
      <div class="gesture-note"><span class="gesture-mark" aria-hidden="true">↗</span><span>깃대는 고정되고 깃털은 드래그 방향으로 움직입니다</span></div>
    </section>
    <section class="bottom-area" aria-live="polite">
      <div class="progress-card">
        <div class="progress-head">
          <div class="progress-title"><span class="progress-mark" aria-hidden="true">Ⅺ</span><span>깃대 분리</span></div>
          <strong id="progress-value">0%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="깃대 분리 진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <div class="progress-label"><span id="progress-hint">깃털을 클릭해 작업 위치로 옮기세요</span><span id="progress-state">준비</span></div>
      </div>
    </section>
    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 11 COMPLETE</p>
        <h2 id="complete-title">11단계 완료</h2>
        <p class="complete-copy">깃털을 양쪽으로 나누고 깃대는 왼쪽 작업대에 내려놓았습니다.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">11단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">12단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
  </main>
  <div id="load-error" role="alert">3D 장면을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요.</div>
  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";
        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const progressValue = document.getElementById("progress-value");
        const progressFill = document.getElementById("progress-fill");
        const progressTrack = document.querySelector(".progress-track");
        const progressHint = document.getElementById("progress-hint");
        const progressState = document.getElementById("progress-state");
        const completionScreen = document.getElementById("complete-screen");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));
        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);

        const tableTop = 0.56;
        const table = new THREE.Group();
        scene.add(table);
        const tableColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < tableColors.length; index += 1) {
          const board = new THREE.Mesh(
            new THREE.BoxGeometry(9.7, 0.2, 0.97),
            new THREE.MeshStandardMaterial({ color: tableColors[index], roughness: 0.83 })
          );
          board.position.set(0, 0.46, -1.94 + index * 0.97);
          board.receiveShadow = true;
          table.add(board);
        }
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.23, 1.15, 0.23), legMaterial);
            leg.position.set(x, -0.115, z);
            table.add(leg);
          }
        }

        const bambooLength = 3.5;
        const bambooStart = -bambooLength / 2 + bambooLength / 12;
        const bambooEnd = bambooLength / 2 - bambooLength / 12;
        const shaftLength = bambooEnd - bambooStart;
        const shaftRadius = 0.044;
        const inkBandWidth = 0.045;
        const inkCenters = [0.24, shaftLength - 0.24];
        const nockLength = shaftLength / 10;
        const arrow = new THREE.Group();
        arrow.position.set(-1.25, tableTop + 0.08625, -1.2);
        const horizontalQuaternion = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
        arrow.quaternion.copy(horizontalQuaternion);
        scene.add(arrow);

        const bambooMaterial = new THREE.MeshStandardMaterial({ color: 0x8eaa67, roughness: 0.48, metalness: 0.02 });
        const glueMaterial = new THREE.MeshStandardMaterial({ color: 0x89502d, roughness: 0.72 });
        const inkMaterial = new THREE.MeshStandardMaterial({ color: 0x12130f, roughness: 0.88 });
        const threadMaterial = new THREE.MeshStandardMaterial({ color: 0xf3efe4, roughness: 0.68, metalness: 0.02 });
        const shaft = new THREE.Mesh(
          new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 32, 1),
          bambooMaterial
        );
        shaft.position.y = shaftLength / 2;
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        arrow.add(shaft);
        const tipEnd = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        tipEnd.position.y = 0;
        tipEnd.castShadow = true;
        arrow.add(tipEnd);
        const nockEnd = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        nockEnd.position.y = shaftLength;
        nockEnd.visible = false;
        arrow.add(nockEnd);
        const coatingBounds = [
          [0, inkCenters[0] - inkBandWidth / 2],
          [inkCenters[1] + inkBandWidth / 2, shaftLength]
        ];
        for (const [start, end] of coatingBounds) {
          const coating = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, end - start, 32, 1),
            glueMaterial
          );
          coating.position.y = (start + end) / 2;
          coating.castShadow = true;
          coating.receiveShadow = true;
          arrow.add(coating);
        }
        for (const y of inkCenters) {
          const band = new THREE.Mesh(          new THREE.CylinderGeometry(0.045, 0.045, inkBandWidth, 24), inkMaterial);
          band.position.y = y;
          band.castShadow = true;
          arrow.add(band);
        }
        for (const [start, end] of coatingBounds) {
          const points = [];
          const loops = 4;
          for (let index = 0; index <= 128; index += 1) {
            const amount = index / 128;
            const angle = amount * loops * Math.PI * 2;
            points.push(new THREE.Vector3(
              Math.sin(angle) * 0.0515,
              start + (end - start) * amount,
              Math.cos(angle) * 0.0515
            ));
          }
          const thread = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 128, 0.006, 8, false),
            threadMaterial
          );
          thread.castShadow = true;
          thread.receiveShadow = true;
          arrow.add(thread);
        }

        const nockGroup = new THREE.Group();
        const nockCenterY = shaftLength + nockLength / 2 - 0.08;
        nockGroup.position.y = nockCenterY;
        arrow.add(nockGroup);
        const nockMaterial = new THREE.MeshStandardMaterial({ color: 0xd8c18d, roughness: 0.76 });
        const nockBody = new THREE.Mesh(
          new THREE.CylinderGeometry(shaftRadius, shaftRadius, nockLength, 28, 1),
          nockMaterial
        );
        nockBody.castShadow = true;
        nockBody.receiveShadow = true;
        nockGroup.add(nockBody);
        const nockGlue = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.045, nockLength / 2, 24, 1),
          glueMaterial
        );
        nockGlue.position.y = -nockLength / 4;
        nockGlue.castShadow = true;
        nockGroup.add(nockGlue);
        const notchVertices = [];
        const notchIndices = [];
        const notchColumns = 12;
        const notchRows = 12;
        for (let row = 0; row <= notchRows; row += 1) {
          const y = nockLength / 2 - 0.095 * row / notchRows;
          for (let column = 0; column <= notchColumns; column += 1) {
            const x = -0.025 + 0.05 * column / notchColumns;
            const z = Math.sqrt(Math.max(0, shaftRadius * shaftRadius - x * x)) + 0.001;
            notchVertices.push(x, y, z);
          }
        }
        for (let row = 0; row < notchRows; row += 1) {
          for (let column = 0; column < notchColumns; column += 1) {
            const a = row * (notchColumns + 1) + column;
            const b = a + notchColumns + 1;
            notchIndices.push(a, b, a + 1, b, b + 1, a + 1);
          }
        }
        const notchGeometry = new THREE.BufferGeometry();
        notchGeometry.setAttribute("position", new THREE.Float32BufferAttribute(notchVertices, 3));
        notchGeometry.setIndex(notchIndices);
        notchGeometry.computeVertexNormals();
        const notch = new THREE.Mesh(
          notchGeometry,
          new THREE.MeshStandardMaterial({ color: 0x34251a, roughness: 0.95, side: THREE.DoubleSide })
        );
        nockGroup.add(notch);

        const initialHeadPosition = -0.26;
        const droppedHeadPosition = 0.005;
        const hitStep = 0.01;
        const requiredHits = 5;
        const fittedHeadPosition = droppedHeadPosition + hitStep * requiredHits;
        const headRadius = shaftRadius * 1.16;
        const arrowheadLength = 0.34;
        const headMaterial = new THREE.MeshStandardMaterial({ color: 0x718082, roughness: 0.27, metalness: 0.82 });
        const headProfile = [
          new THREE.Vector2(0, -arrowheadLength),
          new THREE.Vector2(0.009, -arrowheadLength + 0.012),
          new THREE.Vector2(0.0225, -0.29),
          new THREE.Vector2(0.0355, -0.235),
          new THREE.Vector2(headRadius * 0.82, -0.17),
          new THREE.Vector2(headRadius, -0.025),
          new THREE.Vector2(headRadius * 0.94, 0),
          new THREE.Vector2(0, 0)
        ];
        const arrowHead = new THREE.Group();
        arrowHead.position.set(0, fittedHeadPosition, 0);
        arrow.add(arrowHead);
        const headMesh = new THREE.Mesh(new THREE.LatheGeometry(headProfile, 32), headMaterial);
        headMesh.castShadow = true;
        headMesh.receiveShadow = true;
        arrowHead.add(headMesh);
        tipEnd.visible = false;

        const featherLength = 1.52;
        const featherHalfLength = featherLength / 2;
        const featherHalfWidth = 0.23;
        const separationDistance = 1.58;
        const shaftLeftTableOffset = 3.8;
        const vaneMaterial = new THREE.MeshStandardMaterial({
          color: 0xc5b58f,
          roughness: 0.82,
          side: THREE.DoubleSide
        });
        const barbMaterials = [
          new THREE.MeshStandardMaterial({ color: 0xe2d6b8, roughness: 0.8 }),
          new THREE.MeshStandardMaterial({ color: 0xb5a37b, roughness: 0.84 })
        ];
        const quillMaterial = new THREE.MeshStandardMaterial({ color: 0xe6d2a4, roughness: 0.62 });
        const guideMaterial = new THREE.MeshStandardMaterial({
          color: 0xd7ad6c,
          emissive: 0x3d2810,
          roughness: 0.42,
          metalness: 0.32
        });
        const grabMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          colorWrite: false,
          depthWrite: false
        });

        const featherRoot = new THREE.Group();
        const initialFeatherPosition = new THREE.Vector3(1.25, tableTop + 0.13, -0.12);
        const focusedFeatherPosition = new THREE.Vector3(0.25, tableTop + 0.4, 1.75);
        const restingFeatherPosition = new THREE.Vector3(0.25, tableTop + 0.13, 1.75);
        const baseFeatherScale = 2 / 3;
        const focusScale = baseFeatherScale * 1.35;
        const featherOrientation = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(1, 0, 0), Math.PI / 2)
          .multiply(new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2));
        const focusedFeatherOrientation = new THREE.Quaternion()
          .setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
        featherRoot.position.copy(initialFeatherPosition);
        featherRoot.quaternion.copy(featherOrientation);
        featherRoot.scale.setScalar(baseFeatherScale);
        scene.add(featherRoot);

        const vaneGroups = [];
        const barbCount = 24;
        for (const side of [-1, 1]) {
          const vaneGroup = new THREE.Group();
          featherRoot.add(vaneGroup);
          vaneGroups.push({ group: vaneGroup, side });

          const featherShape = new THREE.Shape();
          featherShape.moveTo(0, -featherHalfLength);
          featherShape.quadraticCurveTo(
            side * featherHalfWidth * 0.95,
            -featherHalfLength * 0.62,
            side * featherHalfWidth,
            0
          );
          featherShape.quadraticCurveTo(
            side * featherHalfWidth * 0.82,
            featherHalfLength * 0.65,
            0,
            featherHalfLength
          );
          featherShape.lineTo(0, -featherHalfLength);
          const vaneMesh = new THREE.Mesh(
            new THREE.ExtrudeGeometry(featherShape, {
              depth: 0.009,
              bevelEnabled: true,
              bevelSegments: 1,
              bevelSize: 0.003,
              bevelThickness: 0.002
            }),
            vaneMaterial
          );
          vaneMesh.position.z = -0.009;
          vaneMesh.castShadow = true;
          vaneMesh.receiveShadow = true;
          vaneGroup.add(vaneMesh);

          for (let row = 0; row < barbCount; row += 1) {
            const amount = (row + 0.5) / barbCount;
            const y = -featherHalfLength + featherLength * amount;
            const width = featherHalfWidth * Math.pow(Math.sin(Math.PI * amount), 0.82);
            const dx = side * width;
            const dy = 0.085;
            const direction = new THREE.Vector3(dx, dy, 0);
            const barb = new THREE.Mesh(
              new THREE.CylinderGeometry(0.00075, 0.003, direction.length(), 5),
              barbMaterials[(row + (side > 0 ? 1 : 0)) % barbMaterials.length]
            );
            barb.position.set(dx / 2, y + dy / 2, 0.011);
            barb.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction.normalize());
            barb.castShadow = true;
            vaneGroup.add(barb);
          }
        }

        const shaftGroup = new THREE.Group();
        featherRoot.add(shaftGroup);
        const quill = new THREE.Mesh(
          new THREE.CylinderGeometry(0.0055, 0.009, featherLength * 0.96, 10, 1),
          quillMaterial
        );
        quill.position.z = 0.052;
        quill.castShadow = true;
        quill.receiveShadow = true;
        shaftGroup.add(quill);
        const quillTip = new THREE.Mesh(new THREE.ConeGeometry(0.0085, 0.14, 10), quillMaterial);
        quillTip.position.set(0, featherHalfLength + 0.05, 0.052);
        quillTip.castShadow = true;
        shaftGroup.add(quillTip);
        const shaftGrabZone = new THREE.Mesh(
          new THREE.CylinderGeometry(0.055, 0.055, featherLength * 0.9, 10, 1),
          grabMaterial
        );
        shaftGrabZone.position.z = 0.08;
        shaftGroup.add(shaftGrabZone);
        const shaftGrip = new THREE.Mesh(
          new THREE.SphereGeometry(0.017, 12, 8),
          guideMaterial
        );
        shaftGrip.position.set(0, 0, 0.079);
        shaftGroup.add(shaftGrip);

        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const laidCameraPosition = new THREE.Vector3(0, 4.8, 8.9);
        const cameraTarget = new THREE.Vector3(0, 0.88, -0.05);
        camera.position.copy(laidCameraPosition);
        camera.lookAt(cameraTarget);

        const pointer = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        const pointerWorld = new THREE.Vector3();
        const dragPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
        let phase = "ready";
        let animationStartedAt = 0;
        let focusTimeout = 0;
        let isDragging = false;
        let dragStartPointerY = 0;
        let dragStartSeparation = 0;
        let separationProgress = 0;

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        function updateProgress() {
          const percent = Math.round(separationProgress * 100);
          progressValue.textContent = `${percent}%`;
          progressFill.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(percent));
          if (phase === "ready") {
            instruction.textContent = "옆에 놓인 깃털을 클릭해 앞으로 가져오세요.";
            progressHint.textContent = "깃털을 클릭해 작업 위치로 옮기세요";
            progressState.textContent = "준비";
          } else if (phase === "moving") {
            instruction.textContent = "깃털을 작업대 앞으로 옮기는 중입니다.";
            progressHint.textContent = "깃털 이동 중";
            progressState.textContent = "이동 중";
          } else if (phase === "pull-ready") {
            instruction.textContent = "깃대 중앙을 잡고 오른쪽으로 길게 드래그하세요.";
            progressHint.textContent = "깃대는 고정되고 깃털은 드래그 방향으로 움직입니다";
            progressState.textContent = `${percent}%`;
          } else if (phase === "dragging") {
            instruction.textContent = "마우스를 움직이는 방향으로 깃털을 끝까지 끌어내세요.";
            progressHint.textContent = "깃대는 고정된 채 깃털이 드래그 방향으로 움직이는 중";
            progressState.textContent = "드래그 중";
          } else if (phase === "settling") {
            instruction.textContent = "깃털을 중앙 깃대 양쪽으로 나누어 작업대에 내려놓는 중입니다.";
            progressHint.textContent = "두 갈래 깃털을 작업대에 놓는 중";
            progressState.textContent = "놓는 중";
          } else if (phase === "placing-shaft") {
            instruction.textContent = "중앙 깃대를 왼쪽 작업대에 내려놓는 중입니다.";
            progressHint.textContent = "깃대가 왼쪽 작업대로 이동 중";
            progressState.textContent = "놓는 중";
          } else {
            instruction.textContent = "깃털을 양쪽으로 나누고 깃대는 왼쪽 작업대에 내려놓았습니다.";
            progressHint.textContent = "깃 준비 완료";
            progressState.textContent = "완료";
          }
        }

        function updatePointer(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          camera.updateMatrixWorld(true);
          scene.updateMatrixWorld(true);
          raycaster.setFromCamera(pointer, camera);
        }

        function finishFocus() {
          if (phase !== "moving") return;
          window.clearTimeout(focusTimeout);
          featherRoot.position.copy(focusedFeatherPosition);
          featherRoot.quaternion.copy(focusedFeatherOrientation);
          featherRoot.scale.setScalar(focusScale);
          phase = "pull-ready";
          updateProgress();
        }

        function beginFocus() {
          phase = "moving";
          animationStartedAt = window.performance.now();
          window.clearTimeout(focusTimeout);
          focusTimeout = window.setTimeout(finishFocus, 760);
          updateProgress();
        }

        function getFeatherLocalPointerPoint() {
          if (!raycaster.ray.intersectPlane(dragPlane, pointerWorld)) return null;
          return featherRoot.worldToLocal(pointerWorld.clone());
        }

        function completeSeparation(pointerId) {
          if (phase === "settling" || phase === "complete") return;
          separationProgress = 1;
          for (const { group } of vaneGroups) {
            group.position.y = separationDistance;
          }
          isDragging = false;
          phase = "settling";
          animationStartedAt = window.performance.now();
          if (renderer.domElement.hasPointerCapture(pointerId)) {
            renderer.domElement.releasePointerCapture(pointerId);
          }
          updateProgress();
        }

        function finishDrag(event) {
          if (!isDragging) return;
          isDragging = false;
          if (renderer.domElement.hasPointerCapture(event.pointerId)) {
            renderer.domElement.releasePointerCapture(event.pointerId);
          }
          renderer.domElement.style.cursor = "default";
          phase = "pull-ready";
          updateProgress();
        }

        function resetStage() {
          window.clearTimeout(focusTimeout);
          phase = "ready";
          animationStartedAt = 0;
          isDragging = false;
          separationProgress = 0;
          dragStartPointerY = 0;
          dragStartSeparation = 0;
          featherRoot.position.copy(initialFeatherPosition);
          featherRoot.quaternion.copy(featherOrientation);
          featherRoot.scale.setScalar(baseFeatherScale);
          shaftGroup.position.set(0, 0, 0);
          for (const { group } of vaneGroups) {
            group.position.set(0, 0, 0);
          }
          completionScreen.classList.remove("is-visible");
          renderer.domElement.style.cursor = "default";
          updateProgress();
        }

        renderer.domElement.addEventListener("pointerdown", (event) => {
          if (event.button !== 0 || phase === "moving" || phase === "settling" || phase === "placing-shaft" || phase === "complete") return;
          updatePointer(event);
          if (phase === "ready" && raycaster.intersectObject(featherRoot, true).length > 0) {
            beginFocus();
            event.preventDefault();
            return;
          }
          if (phase === "pull-ready") {
            const hit = raycaster.intersectObject(shaftGrabZone, false)[0];
            if (!hit) return;
            const localHit = featherRoot.worldToLocal(hit.point.clone());
            dragStartPointerY = localHit.y;
            dragStartSeparation = separationProgress * separationDistance;
            const planePoint = shaftGroup.localToWorld(new THREE.Vector3(0, 0, 0.08));
            dragPlane.constant = -planePoint.z;
            isDragging = true;
            phase = "dragging";
            renderer.domElement.setPointerCapture(event.pointerId);
            renderer.domElement.style.cursor = "grabbing";
            updateProgress();
            event.preventDefault();
          }
        });

        renderer.domElement.addEventListener("pointermove", (event) => {
          updatePointer(event);
          if (isDragging && phase === "dragging") {
            const localPoint = getFeatherLocalPointerPoint();
            if (localPoint) {
              const distance = THREE.MathUtils.clamp(
                dragStartSeparation + localPoint.y - dragStartPointerY,
                0,
                separationDistance
              );
              for (const { group } of vaneGroups) {
                group.position.y = distance;
              }
              separationProgress = distance / separationDistance;
              if (separationProgress >= 0.98) {
                completeSeparation(event.pointerId);
              } else {
                updateProgress();
              }
            }
            renderer.domElement.style.cursor = "grabbing";
            event.preventDefault();
            return;
          }
          if (phase === "ready") {
            renderer.domElement.style.cursor = raycaster.intersectObject(featherRoot, true).length > 0 ? "pointer" : "default";
          } else if (phase === "pull-ready") {
            renderer.domElement.style.cursor = raycaster.intersectObject(shaftGrabZone, false).length > 0 ? "grab" : "default";
          } else {
            renderer.domElement.style.cursor = "default";
          }
        });

        renderer.domElement.addEventListener("pointerup", finishDrag);
        renderer.domElement.addEventListener("pointercancel", finishDrag);
        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage12.html";
        });
        window.addEventListener("resize", resize);
        resize();
        updateProgress();
        renderer.setAnimationLoop(() => {
          if (phase === "moving") {
            const amount = Math.min((window.performance.now() - animationStartedAt) / 720, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            featherRoot.position.lerpVectors(initialFeatherPosition, focusedFeatherPosition, eased);
            featherRoot.quaternion.slerpQuaternions(featherOrientation, focusedFeatherOrientation, eased);
            featherRoot.scale.setScalar(baseFeatherScale + (focusScale - baseFeatherScale) * eased);
            if (amount >= 1) finishFocus();
          } else if (phase === "settling") {
            const amount = Math.min((window.performance.now() - animationStartedAt) / 1050, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            featherRoot.position.lerpVectors(focusedFeatherPosition, restingFeatherPosition, eased);
            featherRoot.quaternion.slerpQuaternions(focusedFeatherOrientation, featherOrientation, eased);
            for (const { group, side } of vaneGroups) {
              group.position.x = side * 0.12 * eased;
              group.position.y = separationDistance * (1 - eased);
            }
            if (amount >= 1) {
              featherRoot.position.copy(restingFeatherPosition);
              featherRoot.quaternion.copy(featherOrientation);
              for (const { group, side } of vaneGroups) {
                group.position.set(side * 0.12, 0, 0);
              }
              phase = "placing-shaft";
              animationStartedAt = window.performance.now();
              updateProgress();
            }
          } else if (phase === "placing-shaft") {
            const amount = Math.min((window.performance.now() - animationStartedAt) / 850, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            shaftGroup.position.y = -shaftLeftTableOffset * eased;
            if (amount >= 1) {
              shaftGroup.position.y = -shaftLeftTableOffset;
              phase = "complete";
              completionScreen.classList.add("is-visible");
              updateProgress();
            }
          }
          renderer.render(scene, camera);
        });
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the feather-preparation stage could not start.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
