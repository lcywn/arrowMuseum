<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 2단계 다듬기</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --muted: #b8b8a5;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .84);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: default;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .83) 0%, rgba(13, 20, 18, .55) 29%, transparent 58%),
        linear-gradient(0deg, rgba(11, 17, 15, .78), transparent 34%, rgba(11, 17, 15, .3));
    }

    #interface {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 26px;
      left: clamp(24px, 4.2vw, 66px);
      right: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1;
    }

    .brand-copy { display: grid; gap: 3px; }

    .brand-copy small {
      color: var(--gold);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .brand-copy strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      letter-spacing: .04em;
      backdrop-filter: blur(12px);
    }

    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .intro {
      position: absolute;
      top: clamp(145px, 25vh, 220px);
      left: clamp(44px, 7vw, 112px);
      width: min(365px, 34vw);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(34px, 3.5vw, 49px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.35;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }

    h1 em {
      color: #d9c294;
      font-style: normal;
    }

    #instruction {
      min-height: 48px;
      margin: 18px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      font-weight: 400;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }

    .gesture-note {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 24px;
      color: #a7ad9e;
      font-size: 11px;
      letter-spacing: .015em;
    }

    .click-icon {
      position: relative;
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .click-icon::after {
      position: absolute;
      top: 5px;
      right: 4px;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--gold);
      content: "";
      box-shadow: 0 0 8px rgba(215, 173, 108, .8);
    }

    .bottom-area {
      position: absolute;
      right: 24px;
      bottom: 30px;
      left: 24px;
      display: flex;
      justify-content: center;
    }

    .progress-card {
      width: min(520px, 100%);
      padding: 17px 21px 15px;
      border: 1px solid rgba(221, 204, 163, .22);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
    }

    .progress-head, .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .progress-title {
      display: flex;
      align-items: center;
      gap: 9px;
      color: #e5dfce;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .04em;
    }

    .progress-mark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .45);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 11px;
    }

    #node-count {
      color: #f1d5a5;
      font-family: Georgia, serif;
      font-size: 19px;
    }

    #node-count small {
      margin-left: 2px;
      color: #b8b5a7;
      font-family: inherit;
      font-size: 11px;
    }

    .progress-track {
      height: 7px;
      margin: 12px 0 10px;
      overflow: hidden;
      border-radius: 8px;
      background: rgba(231, 220, 191, .12);
    }

    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #849e6d, #d2ae6b);
      box-shadow: 0 0 14px rgba(212, 174, 105, .35);
      transition: width .3s ease;
    }

    .progress-label {
      color: #aeb3a4;
      font-size: 10px;
      letter-spacing: .02em;
    }

    #progress-state { color: #d4bd8e; }

    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }

    #complete-screen.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .94);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    #complete-screen.is-visible .complete-card {
      transform: translateY(0) scale(1);
    }

    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }

    .complete-kicker {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .complete-card h2 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: 31px;
      font-weight: 500;
      letter-spacing: -.06em;
    }

    .complete-copy {
      margin: 12px 0 25px;
      color: #b8bbae;
      font-size: 12px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .complete-actions {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 9px;
    }

    .action-button {
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -.02em;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
      pointer-events: auto;
    }

    .action-button:hover {
      border-color: rgba(231, 215, 180, .6);
      background: rgba(255, 255, 255, .05);
      transform: translateY(-1px);
    }

    .action-button.primary {
      border-color: #d6ad70;
      background: #d6ad70;
      color: #25271f;
    }

    .action-button.primary:hover {
      border-color: #ebc98e;
      background: #ebc98e;
    }

    #toast {
      position: absolute;
      bottom: 138px;
      left: 50%;
      padding: 10px 15px;
      border: 1px solid rgba(227, 206, 164, .22);
      border-radius: 999px;
      background: rgba(23, 31, 28, .9);
      color: #e4d7bb;
      font-size: 11px;
      opacity: 0;
      transform: translate(-50%, 8px);
      transition: opacity .2s, transform .2s;
      white-space: nowrap;
    }

    #toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }
    #load-error p { max-width: 470px; line-height: 1.8; }
  </style>
</head>
<body>
  <div id="scene" aria-label="마디를 다듬는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy">
          <small>HANDCRAFT WORKSHOP</small>
          <strong>대나무 공방</strong>
        </div>
      </div>
      <div class="stage-chip"><b>02</b><span>2단계 · 다듬기</span></div>
    </header>

    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 02 &nbsp; / &nbsp; TRIMMING</p>
      <h1>마디를 하나씩<br><em>다듬어 주세요</em></h1>
      <p id="instruction">대나무에 돌출된 마디 부분을 하나씩 클릭하세요.</p>
      <div class="gesture-note">
        <span class="click-icon" aria-hidden="true">＋</span>
        <span>대나무의 마디를 클릭해 제거하세요</span>
      </div>
    </section>

    <section class="bottom-area" aria-live="polite">
      <div class="progress-card">
        <div class="progress-head">
          <div class="progress-title"><span class="progress-mark" aria-hidden="true">Ⅱ</span><span>대나무 마디 다듬기</span></div>
          <strong id="node-count">0<small> / 5</small></strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="마디 다듬기 진행도" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <div class="progress-label">
          <span id="progress-hint">돌출된 마디를 하나씩 클릭하세요</span>
          <span id="progress-state">다듬기 준비</span>
        </div>
      </div>
    </section>

    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 02 COMPLETE</p>
        <h2 id="complete-title">2단계 완료</h2>
        <p class="complete-copy">대나무의 마디를 모두 다듬었어요.<br>다음 작업을 준비해보세요.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">2단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">3단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

    <div id="toast" role="status" aria-live="polite"></div>
  </main>

  <div id="load-error" role="alert">
    <p>3D 장면을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</p>
  </div>

  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";

        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const nodeCountLabel = document.getElementById("node-count");
        const progressFill = document.getElementById("progress-fill");
        const progressTrack = document.querySelector(".progress-track");
        const progressHint = document.getElementById("progress-hint");
        const progressState = document.getElementById("progress-state");
        const completionScreen = document.getElementById("complete-screen");
        const toast = document.getElementById("toast");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);

        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));

        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.left = -9;
        keyLight.shadow.camera.right = 9;
        keyLight.shadow.camera.top = 9;
        keyLight.shadow.camera.bottom = -8;
        keyLight.shadow.bias = -0.00025;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);

        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(15, 5, 0.24),
          new THREE.MeshStandardMaterial({ color: 0x202c27, roughness: 0.9 })
        );
        wall.position.set(0, 1.72, -4.12);
        wall.receiveShadow = true;
        wall.castShadow = true;
        scene.add(wall);

        const slatMaterial = new THREE.MeshStandardMaterial({ color: 0x2d3931, roughness: 0.8 });
        for (let x = -7; x <= 7; x += 0.72) {
          const slat = new THREE.Mesh(new THREE.BoxGeometry(0.045, 3.7, 0.06), slatMaterial);
          slat.position.set(x, 1.7, -3.96);
          slat.castShadow = true;
          scene.add(slat);
        }

        function addBox(parent, size, material, position) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
          mesh.position.set(position[0], position[1], position[2]);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        const table = new THREE.Group();
        scene.add(table);
        const plankColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < 5; index += 1) {
          const material = new THREE.MeshStandardMaterial({
            color: plankColors[index],
            roughness: 0.83,
            metalness: 0.02
          });
          addBox(table, [9.7, 0.2, 0.97], material, [0, 0.46, -1.94 + index * 0.97]);
        }

        const tableEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.78 });
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, -2.48]);
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, 2.48]);

        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            addBox(table, [0.23, 1.15, 0.23], legMaterial, [x, -0.115, z]);
          }
        }

        const braceMaterial = new THREE.MeshStandardMaterial({ color: 0x55402b, roughness: 0.85 });
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, -2.02]);
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, 2.02]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [-3.98, -0.25, 0]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [3.98, -0.25, 0]);

        const TABLE_TOP = 0.56;
        const bambooLength = 3.5;
        const bamboo = new THREE.Group();
        bamboo.position.set(0, TABLE_TOP + 0.056, 1.28);
        scene.add(bamboo);

        const bambooMaterial = new THREE.MeshStandardMaterial({
          color: 0x8eaa67,
          roughness: 0.48,
          metalness: 0.02
        });
        const bambooNodeMaterial = new THREE.MeshStandardMaterial({
          color: 0x4c633b,
          roughness: 0.6,
          metalness: 0.02
        });
        const nodeHitMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          colorWrite: false,
          depthWrite: false
        });

        const nodePositions = [0.06, 0.25, 0.5, 0.75, 0.94];
        const nodeGroups = [];
        const ringNormal = new THREE.Vector3(0, 0, 1);
        const up = new THREE.Vector3(0, 1, 0);
        const removalAnimations = [];
        const NODE_TOTAL = nodePositions.length;
        let removedCount = 0;
        let phase = "playing";
        let hoveredNode = null;
        let toastTimer = 0;

        function makeBambooCurve() {
          const points = [];
          for (let index = 0; index <= 8; index += 1) {
            const t = index / 8;
            points.push(new THREE.Vector3((t - 0.5) * bambooLength, 0, 0));
          }
          return new THREE.CatmullRomCurve3(points, false, "catmullrom", 0.35);
        }

        const bambooCurve = makeBambooCurve();
        const body = new THREE.Mesh(
          new THREE.CylinderGeometry(0.044, 0.044, bambooLength, 32, 1),
          bambooMaterial
        );
        body.quaternion.setFromUnitVectors(up, new THREE.Vector3(1, 0, 0));
        body.castShadow = true;
        body.receiveShadow = true;
        bamboo.add(body);

        for (const t of [0, 1]) {
          const end = new THREE.Mesh(new THREE.SphereGeometry(0.044, 16, 12), bambooMaterial);
          end.position.copy(bambooCurve.getPointAt(t));
          end.castShadow = true;
          bamboo.add(end);
        }

        for (let index = 0; index < nodePositions.length; index += 1) {
          const node = new THREE.Group();
          const t = nodePositions[index];
          const tangent = bambooCurve.getTangentAt(t).normalize();
          node.position.copy(bambooCurve.getPointAt(t));
          node.userData.nodeIndex = index;
          node.userData.removing = false;
          bamboo.add(node);
          nodeGroups.push(node);

          const nodeMaterial = bambooNodeMaterial.clone();
          node.userData.materials = [nodeMaterial];

          const ring = new THREE.Mesh(new THREE.TorusGeometry(0.044, 0.004, 8, 24), nodeMaterial);
          ring.quaternion.setFromUnitVectors(ringNormal, tangent);
          ring.userData.nodeIndex = index;
          ring.castShadow = true;
          node.add(ring);

          const hitTarget = new THREE.Mesh(
            new THREE.CylinderGeometry(0.16, 0.16, 0.24, 10),
            nodeHitMaterial
          );
          hitTarget.quaternion.setFromUnitVectors(up, tangent);
          hitTarget.userData.nodeIndex = index;
          node.add(hitTarget);
        }

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.position.set(0, 6.75, 10.8);
          camera.lookAt(0, 1.05, 0);
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        function updateProgress() {
          const percent = removedCount / NODE_TOTAL * 100;
          nodeCountLabel.innerHTML = `${removedCount}<small> / ${NODE_TOTAL}</small>`;
          progressFill.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(removedCount));
          if (removedCount === 0) {
            progressHint.textContent = "돌출된 마디를 하나씩 클릭하세요";
            progressState.textContent = "다듬기 준비";
          } else if (removedCount < NODE_TOTAL) {
            progressHint.textContent = "좋아요. 남은 마디를 계속 다듬어주세요";
            progressState.textContent = "다듬는 중";
          } else {
            progressHint.textContent = "모든 마디를 다듬었습니다";
            progressState.textContent = "마무리 중";
          }
        }

        function setInstruction(text) {
          instruction.textContent = text;
        }

        function updatePointer(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          camera.updateMatrixWorld(true);
          scene.updateMatrixWorld(true);
          raycaster.setFromCamera(pointer, camera);
        }

        function findNodeAtPointer() {
          if (phase !== "playing") return null;
          const activeNodes = nodeGroups.filter((node) => node.visible && !node.userData.removing);
          if (activeNodes.length === 0) return null;
          const intersections = raycaster.intersectObjects(activeNodes, true);
          if (intersections.length === 0) return null;
          const nodeIndex = intersections[0].object.userData.nodeIndex;
          return Number.isInteger(nodeIndex) ? nodeGroups[nodeIndex] : null;
        }

        function updateHover(node) {
          if (hoveredNode === node) return;
          hoveredNode = node;
          for (const currentNode of nodeGroups) {
            const active = currentNode === hoveredNode && !currentNode.userData.removing;
            for (const material of currentNode.userData.materials) {
              material.emissive.setHex(active ? 0x364d20 : 0x000000);
              material.emissiveIntensity = active ? 0.55 : 0.08;
            }
          }
          renderer.domElement.style.cursor = hoveredNode ? "pointer" : "default";
        }

        function showToast(message) {
          toast.textContent = message;
          toast.classList.add("is-visible");
          window.clearTimeout(toastTimer);
          toastTimer = window.setTimeout(() => toast.classList.remove("is-visible"), 2400);
        }

        function removeNode(node) {
          if (phase !== "playing" || !node || node.userData.removing || !node.visible) return;
          node.userData.removing = true;
          node.userData.materials.forEach((material) => {
            material.transparent = true;
            material.opacity = 1;
          });
          removalAnimations.push({ node: node, elapsed: 0 });
          removedCount += 1;
          updateProgress();

          if (removedCount < NODE_TOTAL) {
            setInstruction("마디를 잘 다듬고 있어요. 남은 부분도 클릭해주세요.");
          } else {
            phase = "finishing";
            setInstruction("마지막 마디를 다듬고 있습니다.");
          }
        }

        function finishStage() {
          phase = "complete";
          setInstruction("대나무 마디를 모두 다듬었습니다.");
          completionScreen.classList.add("is-visible");
          renderer.domElement.style.cursor = "default";
        }

        function resetStage() {
          phase = "playing";
          removedCount = 0;
          hoveredNode = null;
          removalAnimations.length = 0;
          for (const node of nodeGroups) {
            node.visible = true;
            node.scale.set(1, 1, 1);
            node.position.y = 0;
            node.userData.removing = false;
            node.userData.materials.forEach((material) => {
              material.transparent = false;
              material.opacity = 1;
              material.emissive.setHex(0x000000);
              material.emissiveIntensity = 0.08;
            });
          }
          completionScreen.classList.remove("is-visible");
          setInstruction("대나무에 돌출된 마디 부분을 하나씩 클릭하세요.");
          updateProgress();
          renderer.domElement.style.cursor = "default";
          toast.classList.remove("is-visible");
        }

        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        const clock = new THREE.Clock();

        renderer.domElement.addEventListener("pointermove", (event) => {
          updatePointer(event);
          updateHover(findNodeAtPointer());
        });

        renderer.domElement.addEventListener("pointerleave", () => updateHover(null));

        renderer.domElement.addEventListener("pointerdown", (event) => {
          if (phase !== "playing") return;
          updatePointer(event);
          removeNode(findNodeAtPointer());
          event.preventDefault();
        });

        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage3.html";
        });

        function animate() {
          requestAnimationFrame(animate);
          const delta = Math.min(clock.getDelta(), 0.05);

          for (let index = removalAnimations.length - 1; index >= 0; index -= 1) {
            const animation = removalAnimations[index];
            animation.elapsed += delta;
            const amount = Math.min(animation.elapsed / 0.3, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            animation.node.scale.setScalar(1 - eased);
            animation.node.position.y = Math.sin(amount * Math.PI) * 0.075;
            animation.node.userData.materials.forEach((material) => {
              material.opacity = 1 - eased;
            });
            if (amount >= 1) {
              animation.node.visible = false;
              removalAnimations.splice(index, 1);
            }
          }

          if (phase === "finishing" && removalAnimations.length === 0) finishStage();
          renderer.render(scene, camera);
        }

        window.addEventListener("resize", resize);
        resize();
        updateProgress();
        animate();
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the 3D trimming stage could not start.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
