<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>활만들기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
      background: #303533;
      color: #f4f1e9;
    }
    [hidden] { display: none !important; }
    #start-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      justify-content: center; align-items: center; gap: 34px;
      background: linear-gradient(155deg, #555b53, #282e2b);
    }
    h1 { margin: 0; font-size: clamp(36px, 8vmin, 66px); letter-spacing: 0.1em; }
    #start-button {
      width: clamp(92px, 20vmin, 132px); aspect-ratio: 1;
      border: 1px solid #d5cbb4; border-radius: 50%;
      background: #b8a482; color: #242824; font: inherit;
      font-size: clamp(19px, 4vmin, 24px); font-weight: 700; cursor: pointer;
    }
    #start-button:hover { background: #cbb99a; }
    #start-button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #game { position: absolute; inset: 0; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #instruction, #stage2-instruction {
      position: absolute; top: max(12px, env(safe-area-inset-top)); left: 50%;
      transform: translateX(-50%); width: max-content; max-width: calc(100% - 24px);
      padding: 12px 18px; border: 1px solid #858a80; border-radius: 8px;
      background: rgba(37, 42, 38, 0.9); text-align: center;
      font-size: clamp(13px, 2.8vmin, 17px); line-height: 1.5;
      pointer-events: none;
    }
    #timer {
      position: absolute; transform: translateY(-50%); pointer-events: none;
      display: flex; align-items: center; gap: 8px; z-index: 1;
    }
    #clock {
      display: grid; place-items: center; flex: none;
      width: var(--clock-size, 64px); height: var(--clock-size, 64px);
      border: calc(var(--clock-size, 64px) / 32) solid #e8dfcd; border-radius: 50%;
      background: conic-gradient(#373c37 0deg var(--elapsed-angle, 0deg), #c3ad81 var(--elapsed-angle, 0deg) 360deg);
      color: #242824; font-weight: 700; font-size: calc(var(--clock-size, 64px) * 0.396);
      box-shadow: 0 2px 6px #0005;
    }
    #timer-message {
      position: absolute; bottom: calc(100% + 8px); right: 0;
      width: max-content; max-width: min(220px, 42vw); padding: 8px 11px;
      border-radius: 8px; background: #f0ece3; color: #303530;
      font-size: 13px; line-height: 1.35; box-shadow: 0 2px 6px #0004;
    }
    #timer-message::before {
      content: ""; position: absolute; right: calc(var(--clock-size, 64px) / 2 - 6px); top: 100%;
      border: 6px solid transparent; border-top-color: #f0ece3;
    }
    #clear, #stage2-clear {
      position: absolute; left: 50%; top: 68%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      width: max-content; max-width: 90%; text-align: center;
      color: #fff3c9; font-size: clamp(36px, 10vmin, 72px); font-weight: 800;
      letter-spacing: 0.1em; text-shadow: 0 3px 12px #000b;
    }
    #next-button, #stage2-next-button {
      padding: 11px 20px; border: 1px solid #d5cbb4; border-radius: 6px;
      background: #b8a482; color: #242824; font: inherit; font-size: clamp(14px, 3vmin, 18px);
      letter-spacing: normal; cursor: pointer;
    }
    #next-button:hover, #stage2-next-button:hover { background: #cbb99a; }
    #stage2 { position: absolute; inset: 0; }
    #stage2-restart {
      position: absolute; right: max(12px, env(safe-area-inset-right));
      bottom: max(16px, env(safe-area-inset-bottom)); z-index: 2;
      padding: 9px 14px; border: 1px solid #d5cbb4; border-radius: 6px;
      background: #b8a482; color: #242824; font: inherit; font-size: 14px; cursor: pointer;
    }
    #stage2-restart:hover { background: #cbb99a; }
    #stage2-hint {
      position: absolute; bottom: max(60px, calc(env(safe-area-inset-bottom) + 52px)); left: 50%;
      transform: translateX(-50%); width: max-content; max-width: 90%;
      text-align: center; color: #e6e3db; font-size: clamp(12px, 2.5vmin, 15px);
      pointer-events: none;
    }
    #next-screen {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      background: linear-gradient(155deg, #555b53, #282e2b); text-align: center;
    }
    #next-screen p { margin: 0; font-size: clamp(18px, 4vmin, 24px); }
    @media (max-height: 500px) {
      #clear, #stage2-clear { top: 60%; gap: 5px; font-size: 30px; }
      #next-button, #stage2-next-button { padding: 7px 14px; }
    }
    #error, #stage2-error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(90%, 440px); text-align: center; color: #ffe0d8;
      background: #4a2d2b; padding: 16px; border-radius: 8px;
    }
  </style>
  <script src="./asset/bamboo.js?v=2" defer></script>
  <script src="./asset/hearth.js" defer></script>
  <script src="./asset/endBamboo.js" defer></script>
  <script src="./asset/sapo.js" defer></script>
  <script src="./stage2.js" defer></script>
  <script src="./arrowMain.js" defer></script>
</head>
<body>
  <main>
    <section id="start-screen">
      <h1>활만들기</h1>
      <button id="start-button" type="button">시작</button>
    </section>
    <section id="game" aria-label="활 만들기 게임" hidden>
      <canvas id="game-canvas" aria-label="대나무를 눌러 화로 방향으로 드래그하세요"></canvas>
      <div id="instruction">화로 뚫린 구멍으로 대나무 통과시켜 대나무를 구우며 반듯하게 다듬자</div>
      <div id="timer" hidden>
        <div id="clock" aria-label="남은 시간">3</div>
        <div id="timer-message" role="status" hidden></div>
      </div>
      <div id="clear" hidden>
        <div role="status">CLEAR!</div>
        <button id="next-button" type="button">다음단계로 넘어가기</button>
      </div>
      <div id="error" role="alert" hidden></div>
    </section>
    <!-- 1단계끝 -->
    <section id="stage2" aria-label="2단계 대나무 사포질" hidden>
      <canvas id="stage2-canvas" aria-label="사포를 드래그하여 대나무의 얼룩을 제거하세요"></canvas>
      <div id="stage2-instruction">바람의 저항을 줄이기 위해 사포로 다듬어주세요</div>
      <div id="stage2-hint">사포를 드래그해 문지르기 · 빈 곳을 드래그해 회전 · 핀치 또는 스크롤로 확대</div>
      <button id="stage2-restart" type="button">다시하기</button>
      <div id="stage2-clear" hidden>
        <div role="status">CLEAR!</div>
        <button id="stage2-next-button" type="button">다음단계로 넘어가기</button>
      </div>
      <div id="stage2-error" role="alert" hidden></div>
    </section>
    <section id="next-screen" hidden>
      <h1>활만들기</h1>
      <p>다음 단계 준비 중</p>
    </section>
  </main>
</body>
</html>
