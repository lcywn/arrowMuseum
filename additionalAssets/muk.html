<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>muk · 먹 묻은 대나무 에셋</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; margin: 0; overflow: hidden;
      background: #17211e; color: #eee8dc;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
    }
    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette {
      position: fixed; inset: 0; pointer-events: none;
      background: linear-gradient(90deg, rgba(13, 20, 18, .64), transparent 54%),
        linear-gradient(0deg, rgba(11, 17, 15, .55), transparent 34%, rgba(11, 17, 15, .18));
    }
    header { position: fixed; top: 28px; left: clamp(24px, 5vw, 72px); display: grid; gap: 4px; }
    header small { color: #d7ad6c; font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    header strong { font-size: 14px; letter-spacing: .06em; }
    .caption { position: fixed; bottom: 34px; left: clamp(24px, 5vw, 72px); }
    .caption h1 { margin: 0 0 8px; font: 500 clamp(29px, 4vw, 43px) "Batang", serif; letter-spacing: -.07em; }
    .caption p { margin: 0; color: #a7aaa2; font-size: 11px; }
    .controls { position: fixed; right: 24px; bottom: 32px; display: flex; align-items: center; gap: 16px; color: #b6b9b0; font-size: 10px; }
    button { min-height: 36px; padding: 0 13px; border: 1px solid rgba(232, 214, 174, .23); border-radius: 8px; background: rgba(25, 34, 31, .75); color: inherit; font: inherit; cursor: pointer; }
    #load-error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; background: #17211e; text-align: center; }
    #load-error.is-visible { display: grid; }
    @media (max-width: 620px) {
      header { top: 18px; left: 20px; }
      .caption { bottom: 86px; left: 20px; }
      .controls { right: 20px; bottom: 24px; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-label="회전해 살펴볼 수 있는 muk 3D 에셋"></div>
  <div class="vignette" aria-hidden="true"></div>
  <header><small>HANDCRAFT WORKSHOP / ASSET</small><strong>muk</strong></header>
  <section class="caption">
    <h1>먹을 묻힌 대나무 조각</h1>
    <p>얇게 자른 대나무의 한쪽 끝에 먹을 묻힌 도구입니다.</p>
  </section>
  <div class="controls">
    <span>드래그하여 회전 · 휠로 확대</span>
    <button id="reset-view" type="button">시점 초기화</button>
  </div>
  <div id="load-error" role="alert">3D 에셋을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</div>

  <script src="muk.js"></script>
  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      const host = document.getElementById("scene");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17211e);
      const camera = new THREE.PerspectiveCamera(36, 1, 0.01, 60);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      host.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.9));
      const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.2);
      keyLight.position.set(-4.5, 7, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -1;
      keyLight.shadow.camera.right = 1;
      keyLight.shadow.camera.top = 1;
      keyLight.shadow.camera.bottom = -1;
      keyLight.shadow.bias = -0.00025;
      scene.add(keyLight);
      const fillLight = new THREE.PointLight(0x8eaa8b, 12, 12, 2);
      fillLight.position.set(-3.5, 2.5, -2);
      scene.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x202923, roughness: 0.96 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.02;
      floor.receiveShadow = true;
      scene.add(floor);

      const muk = createMuk(THREE).group;
      muk.position.y = -0.014;
      scene.add(muk);
      let dragging = false;
      let previousX = 0;
      let previousY = 0;

      function resize() {
        const width = Math.max(1, host.clientWidth);
        const height = Math.max(1, host.clientHeight);
        camera.aspect = width / height;
        camera.position.set(0.18, 0.32, Math.max(0.8, height / width * 0.9));
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        dragging = true;
        previousX = event.clientX;
        previousY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!dragging) return;
        muk.rotation.y += (event.clientX - previousX) * 0.008;
        muk.rotation.z += (event.clientY - previousY) * 0.004;
        previousX = event.clientX;
        previousY = event.clientY;
      });
      function endDrag(event) {
        dragging = false;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      }
      renderer.domElement.addEventListener("pointerup", endDrag);
      renderer.domElement.addEventListener("pointercancel", endDrag);
      renderer.domElement.addEventListener("lostpointercapture", () => { dragging = false; });
      renderer.domElement.addEventListener("wheel", (event) => {
        event.preventDefault();
        camera.position.z = THREE.MathUtils.clamp(camera.position.z + event.deltaY * 0.001, 0.5, 1.8);
        camera.lookAt(0, 0, 0);
      }, { passive: false });
      document.getElementById("reset-view").addEventListener("click", () => {
        muk.rotation.set(0, 0, 0);
        resize();
      });

      window.addEventListener("resize", resize);
      resize();
      renderer.setAnimationLoop(() => renderer.render(scene, camera));
    }).catch((error) => {
      console.error("Could not load the muk 3D asset.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
