<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>cleanBamboo · 대나무 에셋</title> //돌기제거 단계 이후의 대나무
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee8dc;
      --muted: #a7aaa2;
      --gold: #d7ad6c;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .64), transparent 54%),
        linear-gradient(0deg, rgba(11, 17, 15, .55), transparent 34%, rgba(11, 17, 15, .18));
    }

    header {
      position: fixed;
      top: 28px;
      left: clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font: 18px Georgia, serif;
    }

    .heading { display: grid; gap: 4px; }
    .heading small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .heading strong { font-size: 14px; font-weight: 600; letter-spacing: .06em; }

    .caption {
      position: fixed;
      bottom: 34px;
      left: clamp(24px, 5vw, 72px);
    }

    .caption p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .caption h1 {
      margin: 0 0 8px;
      font: 500 clamp(29px, 4vw, 43px) "Batang", "Nanum Myeongjo", serif;
      letter-spacing: -.07em;
    }

    .controls {
      position: fixed;
      right: clamp(20px, 4vw, 56px);
      bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b6b9b0;
      font-size: 10px;
    }

    button {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(232, 214, 174, .23);
      border-radius: 8px;
      background: rgba(25, 34, 31, .75);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: rgba(215, 173, 108, .7); }

    #load-error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f1dfbf;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }

    @media (max-width: 620px) {
      header { top: 18px; left: 20px; }
      .caption { bottom: 92px; left: 22px; }
      .controls { right: 20px; bottom: 21px; left: 22px; justify-content: space-between; }
      .controls span { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-label="회전해 살펴볼 수 있는 cleanBamboo 3D 에셋"></div>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div class="mark" aria-hidden="true">竹</div>
    <div class="heading"><small>HANDCRAFT WORKSHOP / ASSET</small><strong>cleanBamboo</strong></div>
  </header>
  <section class="caption">
    <h1>곧게 편 대나무</h1>
    <p>가열 후 곧게 펴진 연갈색 대나무와 은은한 갈색 반점을 표현했습니다.</p>
  </section>
  <div class="controls">
    <span>드래그하여 회전 · 휠로 확대</span>
    <button id="reset-view" type="button">시점 초기화</button>
  </div>
  <div id="load-error" role="alert">3D 에셋을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</div>

  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      const host = document.getElementById("scene");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17211e);
      scene.fog = new THREE.Fog(0x17211e, 12, 24);

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      host.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.9));
      const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.2);
      keyLight.position.set(-4.5, 7, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -4;
      keyLight.shadow.camera.right = 4;
      keyLight.shadow.camera.top = 4;
      keyLight.shadow.camera.bottom = -4;
      keyLight.shadow.bias = -0.00025;
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0x8eaa8b, 12, 12, 2);
      fillLight.position.set(-3.5, 2.5, -2);
      scene.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x202923, roughness: 0.96 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.42;
      floor.receiveShadow = true;
      scene.add(floor);

      const bambooLength = 3.5;
      const bambooRadius = 0.044;
      const curveSegments = 64;
      const radialSegments = 16;
      const bambooCurve = new THREE.LineCurve3(
        new THREE.Vector3(-bambooLength / 2, 0, 0),
        new THREE.Vector3(bambooLength / 2, 0, 0)
      );
      const bamboo = new THREE.Group();
      bamboo.position.y = -0.37;
      scene.add(bamboo);

      const bambooBodyMaterial = new THREE.MeshStandardMaterial({
        color: 0xc69b69,
        roughness: 0.52,
        metalness: 0.02
      });
      const bambooNodeMaterial = new THREE.MeshStandardMaterial({
        color: 0x85663e,
        roughness: 0.62,
        metalness: 0.02
      });
      const bambooBody = new THREE.Mesh(
        new THREE.TubeGeometry(bambooCurve, curveSegments, bambooRadius, radialSegments, false),
        bambooBodyMaterial
      );
      bambooBody.castShadow = true;
      bambooBody.receiveShadow = true;
      bamboo.add(bambooBody);

      const bambooSpotGeometry = new THREE.SphereGeometry(1, 10, 8);
      const bambooSpotMaterial = new THREE.MeshStandardMaterial({
        color: 0x75472f,
        transparent: true,
        opacity: 0.86,
        depthWrite: false,
        roughness: 0.88,
        metalness: 0
      });

      let bambooSpotSeed = 57391;
      const bambooSpotRandom = () => {
        bambooSpotSeed = (bambooSpotSeed * 16807) % 2147483647;
        return (bambooSpotSeed - 1) / 2147483646;
      };
      for (let index = 0; index < 24; index += 1) {
        const depth = 0.003 + bambooSpotRandom() * 0.0015;
        const spot = new THREE.Mesh(bambooSpotGeometry, bambooSpotMaterial);
        spot.scale.set(
          0.03 + bambooSpotRandom() * 0.015,
          0.014 + bambooSpotRandom() * 0.007,
          depth
        );
        const t = (index + 0.15 + bambooSpotRandom() * 0.7) / 24;
        const angle = bambooSpotRandom() * Math.PI * 2;
        const point = bambooCurve.getPointAt(t);
        const tangent = bambooCurve.getTangentAt(t).normalize();
        const radialA = new THREE.Vector3(0, 0, 1).cross(tangent).normalize();
        const radialB = tangent.clone().cross(radialA).normalize();
        const radial = radialA.multiplyScalar(Math.cos(angle))
          .addScaledVector(radialB, Math.sin(angle))
          .normalize();
        const around = radial.clone().cross(tangent).normalize();
        spot.position.copy(point).addScaledVector(radial, bambooRadius - depth * 0.25);
        spot.quaternion.setFromRotationMatrix(
          new THREE.Matrix4().makeBasis(tangent, around, radial)
        );
        bamboo.add(spot);
      }

      const axisNormal = new THREE.Vector3(0, 0, 1);
      const nodePositions = [0.06, 0.25, 0.5, 0.75, 0.94];
      for (const t of nodePositions) {
        const node = new THREE.Mesh(
          new THREE.TorusGeometry(bambooRadius, 0.004, 8, 24),
          bambooNodeMaterial
        );
        node.position.copy(bambooCurve.getPointAt(t));
        node.quaternion.setFromUnitVectors(axisNormal, bambooCurve.getTangentAt(t).normalize());
        bamboo.add(node);
      }

      for (const t of [0, 1]) {
        const end = new THREE.Mesh(
          new THREE.SphereGeometry(bambooRadius, 16, 12),
          bambooBodyMaterial
        );
        end.position.copy(bambooCurve.getPointAt(t));
        end.castShadow = true;
        bamboo.add(end);
      }
      bamboo.position.y = -0.37 + bambooRadius;

      const initialRotation = new THREE.Euler(0, 0, 0);
      let isDragging = false;
      let previousPointerX = 0;
      let previousPointerY = 0;

      function resize() {
        const width = host.clientWidth;
        const height = host.clientHeight;
        camera.aspect = width / height;
        camera.position.set(0, Math.max(2.1, height / width * 2.3), 5.3);
        camera.lookAt(0, 0, 0);
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        isDragging = true;
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        bamboo.rotation.y += (event.clientX - previousPointerX) * 0.008;
        bamboo.rotation.z += (event.clientY - previousPointerY) * 0.004;
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
      });
      function endDrag(event) {
        isDragging = false;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      }
      renderer.domElement.addEventListener("pointerup", endDrag);
      renderer.domElement.addEventListener("pointercancel", endDrag);
      renderer.domElement.addEventListener("lostpointercapture", () => {
        isDragging = false;
      });
      renderer.domElement.addEventListener("wheel", (event) => {
        event.preventDefault();
        camera.position.z = THREE.MathUtils.clamp(camera.position.z + event.deltaY * 0.004, 3.4, 8);
        camera.lookAt(0, 0, 0);
      }, { passive: false });
      document.getElementById("reset-view").addEventListener("click", () => {
        bamboo.rotation.copy(initialRotation);
        resize();
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", resize);
      resize();
      animate();
    }).catch(() => {
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
