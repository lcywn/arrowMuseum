<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WHA2 · 전통 화로 에셋</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee8dc;
      --muted: #a7aaa2;
      --gold: #d7ad6c;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .64), transparent 54%),
        linear-gradient(0deg, rgba(11, 17, 15, .55), transparent 34%, rgba(11, 17, 15, .18));
    }

    header {
      position: fixed;
      top: 28px;
      left: clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font: 18px Georgia, serif;
    }

    .heading { display: grid; gap: 4px; }
    .heading small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .heading strong { font-size: 14px; font-weight: 600; letter-spacing: .06em; }

    .caption {
      position: fixed;
      bottom: 34px;
      left: clamp(24px, 5vw, 72px);
    }

    .caption p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .caption h1 {
      margin: 0 0 8px;
      font: 500 clamp(29px, 4vw, 43px) "Batang", "Nanum Myeongjo", serif;
      letter-spacing: -.07em;
    }

    .controls {
      position: fixed;
      right: clamp(20px, 4vw, 56px);
      bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b6b9b0;
      font-size: 10px;
    }

    button {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(232, 214, 174, .23);
      border-radius: 8px;
      background: rgba(25, 34, 31, .75);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: rgba(215, 173, 108, .7); }

    #load-error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f1dfbf;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }

    @media (max-width: 620px) {
      header { top: 18px; left: 20px; }
      .caption { bottom: 92px; left: 22px; }
      .controls { right: 20px; bottom: 21px; left: 22px; justify-content: space-between; }
      .controls span { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-label="회전해 살펴볼 수 있는 전통 화로 3D 에셋"></div>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div class="mark" aria-hidden="true">火</div>
    <div class="heading"><small>HANDCRAFT WORKSHOP / ASSET</small><strong>WHA2</strong></div>
  </header>
  <section class="caption">
    <h1>관통형 화로</h1>
    <p>나무 몸체와 앞뒤를 관통하는 쇠 원통, 살짝 휜 회색 철판을 표현했습니다.</p>
  </section>
  <div class="controls">
    <span>드래그하여 회전 · 휠로 확대</span>
    <button id="reset-view" type="button">시점 초기화</button>
  </div>
  <div id="load-error" role="alert">3D 에셋을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</div>

  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      const host = document.getElementById("scene");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17211e);
      scene.fog = new THREE.Fog(0x17211e, 12, 24);

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      host.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 2));
      const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.6);
      keyLight.position.set(-4.5, 8, 6);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -6;
      keyLight.shadow.camera.right = 6;
      keyLight.shadow.camera.top = 7;
      keyLight.shadow.camera.bottom = -5;
      keyLight.shadow.bias = -0.00025;
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0x8eaa8b, 22, 16, 2);
      fillLight.position.set(-4, 3.5, -2);
      scene.add(fillLight);
      const steelFill = new THREE.DirectionalLight(0xc6d4d7, 1.6);
      steelFill.position.set(4, 4, 7);
      scene.add(steelFill);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(60, 60),
        new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
      );
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = -0.025;
      floor.receiveShadow = true;
      scene.add(floor);

      let seed = 29417;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      function makeWoodTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const context = canvas.getContext("2d");
        context.fillStyle = "#a08e71";
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let index = 0; index < 180; index += 1) {
          const y = random() * canvas.height;
          const amplitude = 0.4 + random() * 1.2;
          const frequency = 0.008 + random() * 0.02;
          const shade = random() > 0.5 ? 66 : 228;
          context.strokeStyle = `rgba(${shade}, ${Math.max(0, shade - 4)}, ${Math.max(0, shade - 12)}, ${0.025 + random() * 0.04})`;
          context.lineWidth = 0.5 + random() * 0.7;
          context.beginPath();
          for (let x = 0; x <= canvas.width; x += 16) {
            context.lineTo(x, y + Math.sin(x * frequency) * amplitude);
          }
          context.stroke();
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 1.2);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      function makeSubtleRustTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const context = canvas.getContext("2d");
        context.fillStyle = "#929898";
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let index = 0; index < 24; index += 1) {
          const edge = Math.floor(random() * 4);
          const x = edge < 2
            ? (edge === 0 ? 8 + random() * 48 : canvas.width - 56 + random() * 48)
            : random() * canvas.width;
          const y = edge >= 2
            ? (edge === 2 ? 8 + random() * 36 : canvas.height - 44 + random() * 36)
            : random() * canvas.height;
          const radius = 8 + random() * 20;
          const rust = context.createRadialGradient(x, y, 1, x, y, radius);
          rust.addColorStop(0, `rgba(116, 77, 52, ${0.2 + random() * 0.12})`);
          rust.addColorStop(0.65, "rgba(133, 91, 61, 0.12)");
          rust.addColorStop(1, "rgba(133, 91, 61, 0)");
          context.fillStyle = rust;
          context.fillRect(x - radius, y - radius, radius * 2, radius * 2);
        }
        for (let index = 0; index < 90; index += 1) {
          const x = random() * canvas.width;
          const y = random() * canvas.height;
          context.fillStyle = `rgba(115, 77, 54, ${0.04 + random() * 0.06})`;
          context.fillRect(x, y, 1 + random() * 2, 1 + random() * 2);
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(1.4, 1.1);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      const woodTexture = makeWoodTexture();
      const woodMaterial = new THREE.MeshStandardMaterial({
        color: 0x574b3a,
        bumpMap: woodTexture,
        bumpScale: 0.006,
        roughness: 0.88,
        metalness: 0
      });
      const woodBoardMaterials = [0x514332, 0x5c4d39, 0x554733].map((color) => new THREE.MeshStandardMaterial({
        color,
        bumpMap: woodTexture,
        bumpScale: 0.006,
        roughness: 0.86,
        metalness: 0
      }));
      const darkWoodMaterial = new THREE.MeshStandardMaterial({
        color: 0x30271e,
        bumpMap: woodTexture,
        bumpScale: 0.005,
        roughness: 0.95,
        metalness: 0
      });
      const tubeMaterial = new THREE.MeshStandardMaterial({
        color: 0x596264,
        roughness: 0.64,
        metalness: 0.74
      });
      const rustTexture = makeSubtleRustTexture();
      const topSheetMaterial = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: rustTexture,
        bumpMap: rustTexture,
        bumpScale: 0.004,
        side: THREE.DoubleSide,
        roughness: 0.72,
        metalness: 0.76
      });
      const body = new THREE.Group();
      body.scale.x = 2 / 3;
      scene.add(body);

      function addMesh(geometry, material, position, parent = body) {
        const mesh = new THREE.Mesh(geometry, material);
        mesh.position.set(position[0], position[1], position[2]);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        parent.add(mesh);
        return mesh;
      }

      const bodyLength = 3.2;
      const bodyHeight = 1.48;
      const bodyWidth = 1.55;
      const bodyBottom = 0.12;
      const endThickness = 0.11;
      const openingHeight = 0.55;
      const openingRadius = 0.225;

      function makeBentSheetGeometry(length, width, segmentsX, segmentsZ, thickness) {
        const vertices = [];
        const uvs = [];
        const indices = [];
        const columns = segmentsX + 1;
        const rows = segmentsZ + 1;
        const layerSize = columns * rows;

        for (let layer = 0; layer < 2; layer += 1) {
          for (let row = 0; row <= segmentsZ; row += 1) {
            for (let column = 0; column <= segmentsX; column += 1) {
              const x = (column / segmentsX - 0.5) * length;
              const z = (row / segmentsZ - 0.5) * width;
              const normalizedX = x / (length / 2);
              const normalizedZ = z / (width / 2);
              const bend = 0.08 * (normalizedX * normalizedX + normalizedZ * normalizedZ) / 2;
              vertices.push(x, bend - layer * thickness, z);
              uvs.push(column / segmentsX, row / segmentsZ);
            }
          }
        }

        for (let row = 0; row < segmentsZ; row += 1) {
          for (let column = 0; column < segmentsX; column += 1) {
            const a = row * columns + column;
            const b = a + 1;
            const c = a + columns;
            const d = c + 1;
            indices.push(a, c, b, b, c, d);
            indices.push(a + layerSize, b + layerSize, c + layerSize);
            indices.push(b + layerSize, d + layerSize, c + layerSize);
          }
        }

        const perimeter = [];
        for (let column = 0; column <= segmentsX; column += 1) perimeter.push(column);
        for (let row = 1; row <= segmentsZ; row += 1) perimeter.push(row * columns + segmentsX);
        for (let column = segmentsX - 1; column >= 0; column -= 1) perimeter.push(segmentsZ * columns + column);
        for (let row = segmentsZ - 1; row > 0; row -= 1) perimeter.push(row * columns);
        for (let index = 0; index < perimeter.length; index += 1) {
          const a = perimeter[index];
          const b = perimeter[(index + 1) % perimeter.length];
          indices.push(a, b, a + layerSize, b, b + layerSize, a + layerSize);
        }

        const geometry = new THREE.BufferGeometry();
        geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
        geometry.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
        geometry.setIndex(indices);
        geometry.computeVertexNormals();
        return geometry;
      }

      function makeEndPanel(rotationY) {
        const shape = new THREE.Shape();
        shape.moveTo(-bodyWidth / 2, 0);
        shape.lineTo(bodyWidth / 2, 0);
        shape.lineTo(bodyWidth / 2, bodyHeight);
        shape.lineTo(-bodyWidth / 2, bodyHeight);
        shape.closePath();
        const opening = new THREE.Path();
        opening.absarc(0, openingHeight, openingRadius, 0, Math.PI * 2, true);
        shape.holes.push(opening);
        const panel = new THREE.Mesh(
          new THREE.ExtrudeGeometry(shape, { depth: endThickness, bevelEnabled: false, curveSegments: 32 }),
          woodMaterial
        );
        panel.position.y = bodyBottom;
        panel.rotation.y = rotationY;
        panel.castShadow = true;
        panel.receiveShadow = true;
        body.add(panel);
        return panel;
      }

      const leftPanel = makeEndPanel(Math.PI / 2);
      leftPanel.position.x = -bodyLength / 2;
      const rightPanel = makeEndPanel(-Math.PI / 2);
      rightPanel.position.x = bodyLength / 2;

      const sideLength = bodyLength - endThickness * 2;
      const plankGap = 0.012;
      const plankHeight = (bodyHeight - plankGap * 2) / 3;
      for (const side of [-1, 1]) {
        addMesh(
          new THREE.BoxGeometry(sideLength, bodyHeight, 0.1),
          darkWoodMaterial,
          [0, bodyBottom + bodyHeight / 2, side * (bodyWidth / 2 - 0.08)]
        );
        for (let index = 0; index < 3; index += 1) {
          const plank = addMesh(
            new THREE.BoxGeometry(sideLength, plankHeight, 0.1),
            woodBoardMaterials[(index + (side > 0 ? 1 : 0)) % woodBoardMaterials.length],
            [
              0,
              bodyBottom + plankHeight / 2 + index * (plankHeight + plankGap),
              side * (bodyWidth / 2 - 0.025)
            ]
          );
          plank.receiveShadow = true;
        }
      }
      addMesh(
        new THREE.BoxGeometry(sideLength, 0.1, bodyWidth - 0.16),
        woodMaterial,
        [0, bodyBottom + 0.04, 0]
      );

      const bore = addMesh(
        new THREE.CylinderGeometry(openingRadius * 0.96, openingRadius * 0.96, bodyLength + 0.18, 32, 1, true),
        tubeMaterial,
        [0, bodyBottom + openingHeight, 0]
      );
      bore.rotation.z = Math.PI / 2;
      bore.material.side = THREE.DoubleSide;

      for (const x of [-bodyLength / 2 - 0.025, bodyLength / 2 + 0.025]) {
        const portRim = new THREE.Mesh(new THREE.TorusGeometry(openingRadius, 0.025, 8, 32), tubeMaterial);
        portRim.position.set(x, bodyBottom + openingHeight, 0);
        portRim.rotation.y = Math.PI / 2;
        portRim.castShadow = true;
        body.add(portRim);
      }

      const topPlate = addMesh(
        new THREE.BoxGeometry(bodyLength + 0.12, 0.12, bodyWidth + 0.12),
        woodMaterial,
        [0, bodyBottom + bodyHeight + 0.03, 0]
      );
      topPlate.castShadow = true;
      addMesh(
        new THREE.BoxGeometry(bodyLength - 0.16, 0.025, bodyWidth - 0.22),
        darkWoodMaterial,
        [0, bodyBottom + bodyHeight + 0.096, 0]
      );
      for (const z of [-bodyWidth / 2 + 0.04, bodyWidth / 2 - 0.04]) {
        addMesh(
          new THREE.BoxGeometry(bodyLength - 0.12, 0.075, 0.08),
          woodMaterial,
          [0, bodyBottom + bodyHeight + 0.12, z]
        );
      }
      for (const x of [-bodyLength / 2 + 0.04, bodyLength / 2 - 0.04]) {
        addMesh(
          new THREE.BoxGeometry(0.08, 0.075, bodyWidth - 0.12),
          woodMaterial,
          [x, bodyBottom + bodyHeight + 0.12, 0]
        );
      }
      const topSheet = addMesh(
        makeBentSheetGeometry(bodyLength + 0.2, bodyWidth + 0.22, 32, 12, 0.025),
        topSheetMaterial,
        [0, bodyBottom + bodyHeight + 0.16, 0]
      );
      topSheet.castShadow = true;

      const seamMaterial = darkWoodMaterial;
      for (const z of [-1, 1]) {
        addMesh(
          new THREE.BoxGeometry(sideLength - 0.04, 0.018, 0.01),
          seamMaterial,
          [0, bodyBottom + plankHeight + plankGap / 2, z * (bodyWidth / 2 + 0.027)]
        );
        addMesh(
          new THREE.BoxGeometry(sideLength - 0.04, 0.018, 0.01),
          seamMaterial,
          [0, bodyBottom + 2 * plankHeight + 1.5 * plankGap, z * (bodyWidth / 2 + 0.027)]
        );
      }

      const rivetMaterial = darkWoodMaterial;
      for (const x of [-bodyLength / 2 + 0.24, bodyLength / 2 - 0.24]) {
        for (const z of [-bodyWidth / 2 - 0.025, bodyWidth / 2 + 0.025]) {
          for (const y of [bodyBottom + 0.14, bodyBottom + bodyHeight - 0.14]) {
            const rivet = addMesh(new THREE.SphereGeometry(0.026, 8, 6), rivetMaterial, [x, y, z]);
            rivet.scale.set(1.25, 1, 0.42);
          }
        }
      }

      const target = new THREE.Vector3(0, 1.12, 0);
      const initialAzimuth = -0.7;
      const initialPolar = 1.2;
      const initialDistance = 7.8;
      let azimuth = initialAzimuth;
      let polar = initialPolar;
      let distance = initialDistance;
      let dragPointer = null;
      let lastX = 0;
      let lastY = 0;

      function updateCamera() {
        camera.position.set(
          target.x + distance * Math.sin(polar) * Math.sin(azimuth),
          target.y + distance * Math.cos(polar),
          target.z + distance * Math.sin(polar) * Math.cos(azimuth)
        );
        camera.lookAt(target);
      }

      function resize() {
        const width = Math.max(1, host.clientWidth);
        const height = Math.max(1, host.clientHeight);
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        if (event.button !== 0) return;
        dragPointer = event.pointerId;
        lastX = event.clientX;
        lastY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (event.pointerId !== dragPointer) return;
        azimuth -= (event.clientX - lastX) * 0.008;
        polar = THREE.MathUtils.clamp(polar + (event.clientY - lastY) * 0.006, 0.32, 2.65);
        lastX = event.clientX;
        lastY = event.clientY;
        updateCamera();
      });
      renderer.domElement.addEventListener("pointerup", (event) => {
        if (event.pointerId !== dragPointer) return;
        dragPointer = null;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) renderer.domElement.releasePointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointercancel", () => { dragPointer = null; });
      renderer.domElement.addEventListener("wheel", (event) => {
        distance = THREE.MathUtils.clamp(distance + event.deltaY * 0.006, 4.8, 12);
        updateCamera();
        event.preventDefault();
      }, { passive: false });
      document.getElementById("reset-view").addEventListener("click", () => {
        azimuth = initialAzimuth;
        polar = initialPolar;
        distance = initialDistance;
        updateCamera();
      });

      updateCamera();
      resize();
      window.addEventListener("resize", resize);
      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    }).catch((error) => {
      console.error("WHA2 asset failed to load:", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
