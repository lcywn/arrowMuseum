<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>knife · 대나무용 안전 칼 에셋</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #eee8dc;
      --muted: #a7aaa2;
      --gold: #d7ad6c;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    #scene { position: fixed; inset: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }

    .vignette {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .64), transparent 54%),
        linear-gradient(0deg, rgba(11, 17, 15, .55), transparent 34%, rgba(11, 17, 15, .18));
    }

    header {
      position: fixed;
      top: 28px;
      left: clamp(24px, 5vw, 72px);
      display: flex;
      align-items: center;
      gap: 13px;
    }

    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font: 18px Georgia, serif;
    }

    .heading { display: grid; gap: 4px; }
    .heading small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .heading strong { font-size: 14px; font-weight: 600; letter-spacing: .06em; }

    .caption {
      position: fixed;
      bottom: 34px;
      left: clamp(24px, 5vw, 72px);
    }

    .caption p {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .caption h1 {
      margin: 0 0 8px;
      font: 500 clamp(29px, 4vw, 43px) "Batang", "Nanum Myeongjo", serif;
      letter-spacing: -.07em;
    }

    .caption .dimensions { margin-top: 7px; color: #c4a878; }

    .controls {
      position: fixed;
      right: clamp(20px, 4vw, 56px);
      bottom: 32px;
      display: flex;
      align-items: center;
      gap: 16px;
      color: #b6b9b0;
      font-size: 10px;
    }

    button {
      min-height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(232, 214, 174, .23);
      border-radius: 8px;
      background: rgba(25, 34, 31, .75);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }

    button:hover { border-color: rgba(215, 173, 108, .7); }

    #load-error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f1dfbf;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }

    @media (max-width: 620px) {
      header { top: 18px; left: 20px; }
      .caption { bottom: 92px; left: 22px; right: 22px; }
      .caption p { max-width: 420px; line-height: 1.6; }
      .controls { right: 20px; bottom: 21px; left: 22px; justify-content: space-between; }
      .controls span { font-size: 9px; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-label="회전해 살펴볼 수 있는 knife 3D 에셋"></div>
  <div class="vignette" aria-hidden="true"></div>
  <header>
    <div class="mark" aria-hidden="true">刃</div>
    <div class="heading"><small>HANDCRAFT WORKSHOP / ASSET</small><strong>knife</strong></div>
  </header>
  <section class="caption">
    <h1>대나무용 안전 칼</h1>
    <p>날카로운 끝 대신 모서리를 둥글린 쇠 칼날과 거친 철 손잡이로 구성했습니다.</p>
    <p class="dimensions" id="dimensions"></p>
  </section>
  <div class="controls">
    <span>드래그하여 앞·옆면 회전 · 휠로 확대</span>
    <button id="reset-view" type="button">시점 초기화</button>
  </div>
  <div id="load-error" role="alert">3D 에셋을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</div>

  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      const host = document.getElementById("scene");
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x17211e);
      scene.fog = new THREE.Fog(0x17211e, 12, 24);

      const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 60);
      const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.08;
      host.appendChild(renderer.domElement);

      scene.add(new THREE.HemisphereLight(0xdce5ec, 0x263732, 1.9));
      const keyLight = new THREE.DirectionalLight(0xe3edf6, 3.2);
      keyLight.position.set(-4.5, 7, 5);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.set(2048, 2048);
      keyLight.shadow.camera.left = -4;
      keyLight.shadow.camera.right = 4;
      keyLight.shadow.camera.top = 4;
      keyLight.shadow.camera.bottom = -4;
      keyLight.shadow.bias = -0.00025;
      scene.add(keyLight);

      const fillLight = new THREE.PointLight(0xa8bdd0, 12, 12, 2);
      fillLight.position.set(-3.5, 2.5, -2);
      scene.add(fillLight);

      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(80, 80),
        new THREE.MeshStandardMaterial({ color: 0x202923, roughness: 0.96 })
      );
      floor.rotation.x = -Math.PI / 2;
      const floorHeight = -0.02;
      floor.position.y = floorHeight;
      floor.receiveShadow = true;
      scene.add(floor);

      const handleLength = 1.05;
      const handleWidth = 0.35;
      const handleThickness = 0.14;
      const handleBevel = 0.018;
      const bladeLength = 1.3;
      const bladeWidth = 0.25;
      const bladeThickness = 0.04;
      const bladeBevel = 0.006;
      const overlap = 0.045;
      const totalLength = handleLength + bladeLength - overlap;
      document.getElementById("dimensions").textContent =
        `전체 길이 ${totalLength.toFixed(2)} · 둥근 사각 칼날 · 무딘 두께 ${bladeThickness.toFixed(2)}`;

      let seed = 85431;
      function random() {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      }

      function makeHandleTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 256;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Could not create the knife handle texture.");
        context.fillStyle = "#535b5f";
        context.fillRect(0, 0, canvas.width, canvas.height);

        for (let index = 0; index < 1700; index += 1) {
          const shade = random() > 0.56 ? 17 : 139;
          const alpha = shade < 40 ? 0.08 + random() * 0.12 : 0.035 + random() * 0.08;
          context.fillStyle = `rgba(${shade - 2}, ${shade}, ${shade + 3}, ${alpha})`;
          const x = random() * canvas.width;
          const y = random() * canvas.height;
          context.beginPath();
          context.ellipse(
            x,
            y,
            0.5 + random() * 2.4,
            0.45 + random() * 1.5,
            (random() - 0.5) * 0.9,
            0,
            Math.PI * 2
          );
          context.fill();
        }

        for (let index = 0; index < 120; index += 1) {
          const x = random() * canvas.width;
          const y = random() * canvas.height;
          const length = 2 + random() * 16;
          const shade = random() > 0.5 ? 18 : 172;
          context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.035 + random() * 0.08})`;
          context.lineWidth = 0.5 + random() * 1.2;
          context.beginPath();
          context.moveTo(x, y);
          context.lineTo(x + length, y + (random() - 0.5) * 2);
          context.stroke();
        }

        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.repeat.set(2, 1.2);
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      function makeBladeTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 256;
        const context = canvas.getContext("2d");
        if (!context) throw new Error("Could not create the knife blade texture.");
        context.fillStyle = "#abb4b8";
        context.fillRect(0, 0, canvas.width, canvas.height);
        for (let index = 0; index < 150; index += 1) {
          const y = random() * canvas.height;
          const shade = random() > 0.5 ? 57 : 224;
          context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.04 + random() * 0.09})`;
          context.lineWidth = 0.4 + random() * 1.2;
          context.beginPath();
          context.moveTo(0, y);
          context.lineTo(canvas.width, y + (random() - 0.5) * 1.2);
          context.stroke();
        }
        const texture = new THREE.CanvasTexture(canvas);
        texture.colorSpace = THREE.SRGBColorSpace;
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
        return texture;
      }

      function roundedRectangle(width, height, radius) {
        const halfWidth = width / 2;
        const halfHeight = height / 2;
        const shape = new THREE.Shape();
        shape.moveTo(-halfWidth + radius, -halfHeight);
        shape.lineTo(halfWidth - radius, -halfHeight);
        shape.quadraticCurveTo(halfWidth, -halfHeight, halfWidth, -halfHeight + radius);
        shape.lineTo(halfWidth, halfHeight - radius);
        shape.quadraticCurveTo(halfWidth, halfHeight, halfWidth - radius, halfHeight);
        shape.lineTo(-halfWidth + radius, halfHeight);
        shape.quadraticCurveTo(-halfWidth, halfHeight, -halfWidth, halfHeight - radius);
        shape.lineTo(-halfWidth, -halfHeight + radius);
        shape.quadraticCurveTo(-halfWidth, -halfHeight, -halfWidth + radius, -halfHeight);
        return shape;
      }

      const handleTexture = makeHandleTexture();
      const handleMaterial = new THREE.MeshStandardMaterial({
        color: 0xcbd1d4,
        map: handleTexture,
        bumpMap: handleTexture,
        bumpScale: 0.005,
        roughness: 0.5,
        metalness: 0.38
      });
      const bladeTexture = makeBladeTexture();
      const bladeMaterial = new THREE.MeshStandardMaterial({
        color: 0xf0f3f5,
        map: bladeTexture,
        bumpMap: bladeTexture,
        bumpScale: 0.0015,
        roughness: 0.32,
        metalness: 0.48
      });

      function makeRoundedSlab(length, width, thickness, radius, bevel, material) {
        const geometry = new THREE.ExtrudeGeometry(roundedRectangle(length, width, radius), {
          depth: thickness,
          bevelEnabled: true,
          bevelSegments: 2,
          steps: 1,
          bevelSize: bevel,
          bevelThickness: bevel,
          curveSegments: 6
        });
        geometry.translate(0, 0, -thickness / 2);
        const mesh = new THREE.Mesh(geometry, material);
        mesh.rotation.x = -Math.PI / 2;
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      const knife = new THREE.Group();
      scene.add(knife);
      knife.position.y = floorHeight + handleThickness / 2 + handleBevel;

      const handleRight = -totalLength / 2 + handleLength;
      const handleCenterX = -totalLength / 2 + handleLength / 2;
      const bladeStart = handleRight - overlap;
      const bladeCenterX = bladeStart + bladeLength / 2;

      const handle = makeRoundedSlab(
        handleLength,
        handleWidth,
        handleThickness,
        0.07,
        handleBevel,
        handleMaterial
      );
      handle.position.set(handleCenterX, 0, 0);
      knife.add(handle);

      const blade = makeRoundedSlab(
        bladeLength,
        bladeWidth,
        bladeThickness,
        0.045,
        bladeBevel,
        bladeMaterial
      );
      blade.position.set(
        bladeCenterX,
        -(handleThickness - bladeThickness) / 2 - handleBevel + bladeBevel,
        0
      );
      knife.add(blade);

      const target = new THREE.Vector3(0, knife.position.y, 0);
      let cameraDistance = 3.4;
      let isDragging = false;
      let previousPointerX = 0;
      let previousPointerY = 0;

      function positionCamera() {
        camera.position.set(
          target.x,
          target.y + cameraDistance * 0.46,
          target.z + cameraDistance * 0.89
        );
        camera.lookAt(target);
      }

      function resize() {
        const width = Math.max(1, host.clientWidth);
        const height = Math.max(1, host.clientHeight);
        camera.aspect = width / height;
        const halfFov = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
        const horizontalDistance = totalLength / (2 * halfFov * camera.aspect);
        const verticalDistance = handleWidth / (2 * halfFov);
        cameraDistance = Math.max(horizontalDistance, verticalDistance) * 1.42;
        positionCamera();
        camera.updateProjectionMatrix();
        renderer.setSize(width, height, false);
      }

      renderer.domElement.addEventListener("pointerdown", (event) => {
        isDragging = true;
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
        renderer.domElement.setPointerCapture(event.pointerId);
      });
      renderer.domElement.addEventListener("pointermove", (event) => {
        if (!isDragging) return;
        knife.rotation.y += (event.clientX - previousPointerX) * 0.008;
        knife.rotation.x = THREE.MathUtils.clamp(
          knife.rotation.x + (event.clientY - previousPointerY) * 0.006,
          -0.85,
          0.85
        );
        previousPointerX = event.clientX;
        previousPointerY = event.clientY;
      });
      function endDrag(event) {
        isDragging = false;
        if (renderer.domElement.hasPointerCapture(event.pointerId)) {
          renderer.domElement.releasePointerCapture(event.pointerId);
        }
      }
      renderer.domElement.addEventListener("pointerup", endDrag);
      renderer.domElement.addEventListener("pointercancel", endDrag);
      renderer.domElement.addEventListener("lostpointercapture", () => {
        isDragging = false;
      });
      renderer.domElement.addEventListener("wheel", (event) => {
        event.preventDefault();
        cameraDistance = THREE.MathUtils.clamp(
          cameraDistance * Math.exp(event.deltaY * 0.001),
          1.8,
          7
        );
        positionCamera();
      }, { passive: false });
      document.getElementById("reset-view").addEventListener("click", () => {
        knife.rotation.set(0, 0, 0);
        resize();
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }

      window.addEventListener("resize", resize);
      resize();
      animate();
    }).catch((error) => {
      console.error("Three.js failed to load; the knife asset could not be displayed.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
</html>
