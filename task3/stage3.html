<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 3단계 재단</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .84);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }

    #scene {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    #scene canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: default;
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .83) 0%, rgba(13, 20, 18, .55) 29%, transparent 58%),
        linear-gradient(0deg, rgba(11, 17, 15, .78), transparent 34%, rgba(11, 17, 15, .3));
    }

    #interface {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    .topbar {
      position: absolute;
      top: 26px;
      left: clamp(24px, 4.2vw, 66px);
      right: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 19px;
      line-height: 1;
    }

    .brand-copy { display: grid; gap: 3px; }

    .brand-copy small {
      color: var(--gold);
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .22em;
    }

    .brand-copy strong {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      letter-spacing: .04em;
      backdrop-filter: blur(12px);
    }

    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font-family: Georgia, serif;
      font-size: 12px;
    }

    .intro {
      position: absolute;
      top: clamp(104px, 18vh, 168px);
      left: clamp(44px, 7vw, 112px);
      width: min(430px, 42vw);
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .eyebrow::before {
      width: 24px;
      height: 1px;
      background: var(--gold);
      content: "";
    }

    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(28px, 3vw, 36px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.25;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }

    h1 em {
      color: #d9c294;
      font-style: normal;
    }

    #instruction {
      min-height: 36px;
      margin: 13px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }

    .gesture-note {
      display: flex;
      align-items: center;
      gap: 11px;
      margin-top: 16px;
      color: #a7ad9e;
      font-size: 11px;
      letter-spacing: .015em;
    }

    .cut-icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-size: 14px;
    }

    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }

    #complete-screen.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .94);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s cubic-bezier(.2, .8, .2, 1);
    }

    #complete-screen.is-visible .complete-card {
      transform: translateY(0) scale(1);
    }

    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }

    .complete-kicker {
      margin: 0 0 9px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }

    .complete-card h2 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: 31px;
      font-weight: 500;
      letter-spacing: -.06em;
    }

    .complete-copy {
      margin: 12px 0 25px;
      color: #b8bbae;
      font-size: 12px;
      line-height: 1.8;
      word-break: keep-all;
    }

    .complete-actions {
      display: grid;
      grid-template-columns: 1fr 1.15fr;
      gap: 9px;
    }

    .action-button {
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -.02em;
      cursor: pointer;
      transition: background .2s, border-color .2s, transform .2s;
      pointer-events: auto;
    }

    .action-button:hover {
      border-color: rgba(231, 215, 180, .6);
      background: rgba(255, 255, 255, .05);
      transform: translateY(-1px);
    }

    .action-button.primary {
      border-color: #d6ad70;
      background: #d6ad70;
      color: #25271f;
    }

    .action-button.primary:hover {
      border-color: #ebc98e;
      background: #ebc98e;
    }

    #timing-game {
      position: absolute;
      width: 150px;
      height: 150px;
      transform: translate(-50%, -100%);
    }

    #timing-game.is-mobile { transform: translate(-50%, -50%); }
    #timing-game[hidden], #cut-help[hidden] { display: none; }

    #timing-button {
      display: block;
      width: 100%;
      height: 100%;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: rgba(24, 30, 28, .18);
      cursor: pointer;
      pointer-events: auto;
    }

    #timing-button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    #timing-button svg { display: block; width: 100%; height: 100%; overflow: visible; }
    #timing-target { transform-origin: 60px 60px; }
    #timing-target.is-shaking { animation: target-shake .08s ease-in-out 4; }

    @keyframes target-shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    #cut-help {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      min-height: 34px;
      padding: 0 14px;
      border: 1px solid rgba(231, 215, 180, .6);
      border-radius: 8px;
      background: rgba(25, 34, 31, .94);
      color: #f2ead8;
      white-space: nowrap;
      transform: translateX(-50%);
      cursor: pointer;
      pointer-events: auto;
    }

    #timing-game.is-mobile #cut-help { bottom: calc(100% + 4px); min-height: 28px; }

    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }

    #load-error.is-visible { display: grid; }
    #load-error p { max-width: 470px; line-height: 1.8; }

    @media (max-width: 620px) {
      .intro {
        top: 82px;
        left: 20px;
        width: min(350px, calc(100vw - 40px));
      }
      .intro .eyebrow { margin-bottom: 10px; }
      h1 { font-size: clamp(25px, 7vw, 32px); }
      #instruction { min-height: 0; margin-top: 8px; font-size: 11px; }
      .gesture-note { margin-top: 8px; font-size: 10px; }
    }

    @media (max-width: 620px) and (orientation: portrait) {
      #cut-help { bottom: calc(100% + 4px); min-height: 28px; }
    }
  </style>
</head>
<body>
  <div id="scene" aria-label="대나무를 재단하는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>

  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy">
          <small>HANDCRAFT WORKSHOP</small>
          <strong>대나무 공방</strong>
        </div>
      </div>
      <div class="stage-chip"><b>03</b><span>3단계 · 재단</span></div>
    </header>

    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 03 &nbsp; / &nbsp; CUTTING</p>
      <h1>타이밍을 맞춰<br><em>대나무를 재단하세요</em></h1>
      <p id="instruction">실선이 두 점선 사이에 들어오면 원을 눌러주세요.</p>
      <div class="gesture-note">
        <span class="cut-icon" aria-hidden="true">✂</span>
        <span id="cut-side">오른쪽 끝을 재단하세요</span>
      </div>
    </section>

    <div id="timing-game" hidden>
      <button id="cut-help" type="button" hidden>도움받기</button>
      <button id="timing-button" type="button" aria-label="타이밍에 맞춰 오른쪽 대나무 재단">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <g id="timing-target" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="1" stroke-dasharray="3 3">
            <circle cx="60" cy="60" r="25.5"></circle>
            <circle cx="60" cy="60" r="34.5"></circle>
          </g>
          <circle id="timing-ring" cx="60" cy="60" r="11" fill="none" stroke="#fff" stroke-width="2"></circle>
        </svg>
      </button>
    </div>

    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 03 COMPLETE</p>
        <h2 id="complete-title">3단계 완료</h2>
        <p class="complete-copy">대나무 양쪽을 재단했어요.<br>다음 작업을 준비해보세요.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">3단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">4단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>

  </main>

  <div id="load-error" role="alert">
    <p>3D 장면을 불러오지 못했습니다.<br>인터넷 연결을 확인한 뒤 페이지를 새로고침해주세요.</p>
  </div>

  <script src="../additionalAssets/Bamboo.js"></script>
  <script type="module">
    const errorScreen = document.getElementById("load-error");
    function announceStageReady() {
      if (window.parent !== window) {
        window.parent.postMessage({ type: "stage-ready", stage: "stage3" }, "*");
      }
    }

    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";

        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const cutSide = document.getElementById("cut-side");
        const completionScreen = document.getElementById("complete-screen");
        const timingGame = document.getElementById("timing-game");
        const timingButton = document.getElementById("timing-button");
        const timingRing = document.getElementById("timing-ring");
        const timingTarget = document.getElementById("timing-target");
        const [innerTarget, outerTarget] = timingTarget.querySelectorAll("circle");
        const innerRadius = Number(innerTarget.getAttribute("r"));
        const outerRadius = Number(outerTarget.getAttribute("r"));
        const cutHelp = document.getElementById("cut-help");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);

        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));

        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        keyLight.shadow.camera.left = -9;
        keyLight.shadow.camera.right = 9;
        keyLight.shadow.camera.top = 9;
        keyLight.shadow.camera.bottom = -8;
        keyLight.shadow.bias = -0.00025;
        scene.add(keyLight);

        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);

        const wall = new THREE.Mesh(
          new THREE.BoxGeometry(15, 5, 0.24),
          new THREE.MeshStandardMaterial({ color: 0x202c27, roughness: 0.9 })
        );
        wall.position.set(0, 1.72, -4.12);
        wall.receiveShadow = true;
        wall.castShadow = true;
        scene.add(wall);

        const slatMaterial = new THREE.MeshStandardMaterial({ color: 0x2d3931, roughness: 0.8 });
        for (let x = -7; x <= 7; x += 0.72) {
          const slat = new THREE.Mesh(new THREE.BoxGeometry(0.045, 3.7, 0.06), slatMaterial);
          slat.position.set(x, 1.7, -3.96);
          slat.castShadow = true;
          scene.add(slat);
        }

        function addBox(parent, size, material, position) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2]), material);
          mesh.position.set(position[0], position[1], position[2]);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          parent.add(mesh);
          return mesh;
        }

        const workOffset = new THREE.Vector3(0.02, 0, -0.2);
        const table = new THREE.Group();
        table.position.copy(workOffset);
        scene.add(table);
        const plankColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < 5; index += 1) {
          const material = new THREE.MeshStandardMaterial({
            color: plankColors[index],
            roughness: 0.83,
            metalness: 0.02
          });
          addBox(table, [9.7, 0.2, 0.97], material, [0, 0.46, -1.94 + index * 0.97]);
        }

        const tableEdgeMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.78 });
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, -2.48]);
        addBox(table, [9.84, 0.09, 0.09], tableEdgeMaterial, [0, 0.39, 2.48]);

        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            addBox(table, [0.23, 1.15, 0.23], legMaterial, [x, -0.115, z]);
          }
        }

        const braceMaterial = new THREE.MeshStandardMaterial({ color: 0x55402b, roughness: 0.85 });
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, -2.02]);
        addBox(table, [8.35, 0.16, 0.2], braceMaterial, [0, -0.25, 2.02]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [-3.98, -0.25, 0]);
        addBox(table, [0.19, 0.15, 4.15], braceMaterial, [3.98, -0.25, 0]);

        const TABLE_TOP = 0.56;
        const domaLength = 4;
        const domaWidth = 1.5;
        const domaThickness = 0.16;
        const domaStartScale = 0.9;
        const doma = new THREE.Group();
        doma.position.set(workOffset.x, TABLE_TOP + domaThickness / 2, 1.28 + workOffset.z);
        doma.scale.set(domaStartScale, 1, domaStartScale);
        scene.add(doma);

        function roundedRectangle(width, height, radius) {
          const halfWidth = width / 2;
          const halfHeight = height / 2;
          const shape = new THREE.Shape();
          shape.moveTo(-halfWidth + radius, -halfHeight);
          shape.lineTo(halfWidth - radius, -halfHeight);
          shape.quadraticCurveTo(halfWidth, -halfHeight, halfWidth, -halfHeight + radius);
          shape.lineTo(halfWidth, halfHeight - radius);
          shape.quadraticCurveTo(halfWidth, halfHeight, halfWidth - radius, halfHeight);
          shape.lineTo(-halfWidth + radius, halfHeight);
          shape.quadraticCurveTo(-halfWidth, halfHeight, -halfWidth, halfHeight - radius);
          shape.lineTo(-halfWidth, -halfHeight + radius);
          shape.quadraticCurveTo(-halfWidth, -halfHeight, -halfWidth + radius, -halfHeight);
          return shape;
        }

        let woodSeed = 39271;
        function woodRandom() {
          woodSeed = (woodSeed * 16807) % 2147483647;
          return (woodSeed - 1) / 2147483646;
        }

        function makeWoodTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 1024;
          canvas.height = 512;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the cutting board texture.");

          const base = context.createLinearGradient(0, 0, 0, canvas.height);
          base.addColorStop(0, "#81765f");
          base.addColorStop(0.48, "#766e5d");
          base.addColorStop(1, "#6b6455");
          context.fillStyle = base;
          context.fillRect(0, 0, canvas.width, canvas.height);

          for (let index = 0; index < 270; index += 1) {
            const y = woodRandom() * canvas.height;
            const phase = woodRandom() * Math.PI * 2;
            const amplitude = 1.5 + woodRandom() * 4;
            const frequency = 0.002 + woodRandom() * 0.012;
            const darkGrain = woodRandom() > 0.48;
            const alpha = darkGrain ? 0.11 + woodRandom() * 0.14 : 0.06 + woodRandom() * 0.1;
            context.strokeStyle = darkGrain
              ? `rgba(43, 34, 24, ${alpha})`
              : `rgba(195, 180, 151, ${alpha})`;
            context.lineWidth = 0.8 + woodRandom() * 1.4;
            context.beginPath();
            for (let x = 0; x <= canvas.width; x += 16) {
              const wave = Math.sin(x * frequency + phase) * amplitude
                + Math.sin(x * frequency * 0.29 + phase * 1.6) * amplitude * 0.62;
              context.lineTo(x, y + wave);
            }
            context.stroke();
          }

          for (let index = 0; index < 6; index += 1) {
            const x = 110 + woodRandom() * (canvas.width - 220);
            const y = 55 + woodRandom() * (canvas.height - 110);
            const angle = (woodRandom() - 0.5) * 0.08;
            const radiusX = 12 + woodRandom() * 12;
            const radiusY = 3 + woodRandom() * 2.5;
            context.save();
            context.translate(x, y);
            context.rotate(angle);
            for (let ring = 0; ring < 6; ring += 1) {
              context.beginPath();
              context.ellipse(0, 0, radiusX + ring * 4, radiusY + ring * 1.6, 0, 0, Math.PI * 2);
              context.strokeStyle = `rgba(42, 33, 24, ${0.34 - ring * 0.035})`;
              context.lineWidth = 1.2 + (ring === 0 ? 0.8 : 0);
              context.stroke();
            }
            context.beginPath();
            context.ellipse(0, 0, radiusX * 0.45, radiusY * 0.55, 0, 0, Math.PI * 2);
            context.fillStyle = "rgba(42, 33, 24, 0.24)";
            context.fill();
            context.restore();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        const woodTexture = makeWoodTexture();
        const domaMaterial = new THREE.MeshStandardMaterial({
          color: 0xffffff,
          map: woodTexture,
          bumpMap: woodTexture,
          bumpScale: 0.022,
          roughness: 0.98,
          metalness: 0
        });
        const domaShape = roundedRectangle(domaLength, domaWidth, 0.05);
        const domaGeometry = new THREE.ExtrudeGeometry(domaShape, {
          depth: domaThickness,
          bevelEnabled: false,
          steps: 1,
          curveSegments: 6
        });
        domaGeometry.translate(0, 0, -domaThickness / 2);
        const domaBoard = new THREE.Mesh(domaGeometry, domaMaterial);
        domaBoard.rotation.x = -Math.PI / 2;
        domaBoard.castShadow = false;
        domaBoard.receiveShadow = true;
        doma.add(domaBoard);

        const domaTopGeometry = new THREE.ShapeGeometry(domaShape, 6);
        const domaTopPositions = domaTopGeometry.attributes.position;
        const domaTopUvs = [];
        for (let index = 0; index < domaTopPositions.count; index += 1) {
          domaTopUvs.push(
            (domaTopPositions.getX(index) + domaLength / 2) / domaLength,
            (domaTopPositions.getY(index) + domaWidth / 2) / domaWidth
          );
        }
        domaTopGeometry.setAttribute("uv", new THREE.Float32BufferAttribute(domaTopUvs, 2));
        const domaTop = new THREE.Mesh(domaTopGeometry, domaMaterial);
        domaTop.rotation.x = -Math.PI / 2;
        domaTop.position.y = domaThickness / 2 + 0.0005;
        domaTop.receiveShadow = true;
        doma.add(domaTop);

        const bambooAsset = createBamboo(THREE);
        const bambooLength = bambooAsset.length;
        const bambooRadius = bambooAsset.radius;
        const bambooRestY = TABLE_TOP + domaThickness + 0.0005 + bambooRadius;
        const bamboo = bambooAsset.group;
        bamboo.position.set(workOffset.x, bambooRestY, 1.28 + workOffset.z);
        scene.add(bamboo);

        const cutFaceMaterial = createBambooCutFaceMaterial(THREE);
        const up = new THREE.Vector3(0, 1, 0);
        const initialStart = -bambooLength / 2;
        const initialEnd = bambooLength / 2;
        const bambooBody = bambooAsset.body;
        const bambooEnds = bambooAsset.ends;

        const knifeScale = 0.55;
        const knifeHandleLength = 1.05;
        const knifeHandleWidth = 0.35;
        const knifeHandleThickness = 0.14;
        const knifeHandleBevel = 0.018;
        const knifeBladeLength = 1.3;
        const knifeBladeWidth = 0.25;
        const knifeBladeThickness = 0.04;
        const knifeBladeBevel = 0.006;
        const knifeOverlap = 0.045;
        const knifeTotalLength = knifeHandleLength + knifeBladeLength - knifeOverlap;
        let knifeSeed = 85431;
        function knifeRandom() {
          knifeSeed = (knifeSeed * 16807) % 2147483647;
          return (knifeSeed - 1) / 2147483646;
        }

        function makeKnifeHandleTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 256;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the knife handle texture.");
          context.fillStyle = "#535b5f";
          context.fillRect(0, 0, canvas.width, canvas.height);

          for (let index = 0; index < 1700; index += 1) {
            const shade = knifeRandom() > 0.56 ? 17 : 139;
            const alpha = shade < 40 ? 0.08 + knifeRandom() * 0.12 : 0.035 + knifeRandom() * 0.08;
            context.fillStyle = `rgba(${shade - 2}, ${shade}, ${shade + 3}, ${alpha})`;
            const x = knifeRandom() * canvas.width;
            const y = knifeRandom() * canvas.height;
            context.beginPath();
            context.ellipse(
              x,
              y,
              0.5 + knifeRandom() * 2.4,
              0.45 + knifeRandom() * 1.5,
              (knifeRandom() - 0.5) * 0.9,
              0,
              Math.PI * 2
            );
            context.fill();
          }

          for (let index = 0; index < 120; index += 1) {
            const x = knifeRandom() * canvas.width;
            const y = knifeRandom() * canvas.height;
            const length = 2 + knifeRandom() * 16;
            const shade = knifeRandom() > 0.5 ? 18 : 172;
            context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.035 + knifeRandom() * 0.08})`;
            context.lineWidth = 0.5 + knifeRandom() * 1.2;
            context.beginPath();
            context.moveTo(x, y);
            context.lineTo(x + length, y + (knifeRandom() - 0.5) * 2);
            context.stroke();
          }

          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.repeat.set(2, 1.2);
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        function makeKnifeBladeTexture() {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 256;
          const context = canvas.getContext("2d");
          if (!context) throw new Error("Could not create the knife blade texture.");
          context.fillStyle = "#abb4b8";
          context.fillRect(0, 0, canvas.width, canvas.height);
          for (let index = 0; index < 150; index += 1) {
            const y = knifeRandom() * canvas.height;
            const shade = knifeRandom() > 0.5 ? 57 : 224;
            context.strokeStyle = `rgba(${shade - 2}, ${shade}, ${shade + 4}, ${0.04 + knifeRandom() * 0.09})`;
            context.lineWidth = 0.4 + knifeRandom() * 1.2;
            context.beginPath();
            context.moveTo(0, y);
            context.lineTo(canvas.width, y + (knifeRandom() - 0.5) * 1.2);
            context.stroke();
          }
          const texture = new THREE.CanvasTexture(canvas);
          texture.colorSpace = THREE.SRGBColorSpace;
          texture.wrapS = THREE.RepeatWrapping;
          texture.wrapT = THREE.RepeatWrapping;
          texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
          return texture;
        }

        const knifeHandleMaterial = new THREE.MeshStandardMaterial({
          color: 0xcbd1d4,
          map: makeKnifeHandleTexture(),
          bumpScale: 0.005,
          roughness: 0.5,
          metalness: 0.38
        });
        knifeHandleMaterial.bumpMap = knifeHandleMaterial.map;
        const knifeBladeMaterial = new THREE.MeshStandardMaterial({
          color: 0xf0f3f5,
          map: makeKnifeBladeTexture(),
          bumpScale: 0.0015,
          roughness: 0.32,
          metalness: 0.48
        });
        knifeBladeMaterial.bumpMap = knifeBladeMaterial.map;

        function makeKnifeSlab(length, width, thickness, radius, bevel, material) {
          const geometry = new THREE.ExtrudeGeometry(roundedRectangle(length, width, radius), {
            depth: thickness,
            bevelEnabled: true,
            bevelSegments: 2,
            steps: 1,
            bevelSize: bevel,
            bevelThickness: bevel,
            curveSegments: 6
          });
          geometry.translate(0, 0, -thickness / 2);
          const mesh = new THREE.Mesh(geometry, material);
          mesh.rotation.x = -Math.PI / 2;
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          return mesh;
        }

        const knife = new THREE.Group();
        const knifeHandleRight = -knifeTotalLength / 2 + knifeHandleLength;
        const knifeBladeCenterX = knifeHandleRight - knifeOverlap + knifeBladeLength / 2;
        const knifeHandle = makeKnifeSlab(
          knifeHandleLength,
          knifeHandleWidth,
          knifeHandleThickness,
          0.07,
          knifeHandleBevel,
          knifeHandleMaterial
        );
        knifeHandle.position.x = -knifeTotalLength / 2 + knifeHandleLength / 2;
        knife.add(knifeHandle);

        const knifeBlade = makeKnifeSlab(
          knifeBladeLength,
          knifeBladeWidth,
          knifeBladeThickness,
          0.045,
          knifeBladeBevel,
          knifeBladeMaterial
        );
        knifeBlade.position.set(
          knifeBladeCenterX,
          -(knifeHandleThickness - knifeBladeThickness) / 2 - knifeHandleBevel + knifeBladeBevel,
          0
        );
        knife.add(knifeBlade);

        knife.scale.setScalar(knifeScale);
        const knifeDirection = new THREE.Vector3(0.55, -0.4, 0.73).normalize();
        const knifeFaceNormal = new THREE.Vector3(3, 0.42, 0.22).normalize();
        knifeFaceNormal.addScaledVector(
          knifeDirection,
          -knifeFaceNormal.dot(knifeDirection)
        ).normalize();
        const knifeSide = new THREE.Vector3()
          .crossVectors(knifeDirection, knifeFaceNormal)
          .normalize();
        knife.quaternion.setFromRotationMatrix(
          new THREE.Matrix4().makeBasis(knifeDirection, knifeFaceNormal, knifeSide)
        );
        const knifeContact = new THREE.Vector3(
          bamboo.position.x + getBambooCutPosition(bambooLength),
          bambooRestY + bambooRadius,
          bamboo.position.z
        );
        knife.position.copy(knifeContact)
          .addScaledVector(knifeDirection, -knifeTotalLength / 2 * knifeScale)
          .addScaledVector(
            knifeSide,
            (knifeBladeWidth / 2 + knifeBladeBevel) * knifeScale
          )
          .addScaledVector(
            knifeFaceNormal,
            (knifeHandleThickness / 2 + knifeHandleBevel) * knifeScale
          );
        scene.add(knife);
        const knifeRestPosition = knife.position.clone();
        const knifeRestRotation = knife.quaternion.clone();
        const knifeLeftPosition = new THREE.Vector3(
          2 * bamboo.position.x - knifeRestPosition.x,
          knifeRestPosition.y,
          2 * bamboo.position.z - knifeRestPosition.z
        );
        const knifeLeftRotation = new THREE.Quaternion()
          .setFromAxisAngle(up, Math.PI)
          .multiply(knifeRestRotation);

        const cutPosition = getBambooCutPosition(bambooLength);
        const cutMarker = new THREE.Group();
        cutMarker.position.x = cutPosition;
        const cutMarkerMaterial = new THREE.MeshStandardMaterial({
          color: 0xe7bd72,
          emissive: 0x6a3b12,
          emissiveIntensity: 0.4,
          roughness: 0.42,
          metalness: 0.06
        });
        const cutMarkerDot = new THREE.SphereGeometry(0.011, 10, 8);
        for (let index = 0; index < 12; index += 1) {
          const angle = index / 12 * Math.PI * 2;
          const dot = new THREE.Mesh(cutMarkerDot, cutMarkerMaterial);
          dot.position.set(0, Math.cos(angle) * 0.06, Math.sin(angle) * 0.06);
          dot.castShadow = true;
          cutMarker.add(dot);
        }
        bamboo.add(cutMarker);

        const sides = [
          { name: "오른쪽", position: cutPosition, endIndex: 1, end: initialEnd, direction: 1 },
          { name: "왼쪽", position: -cutPosition, endIndex: 0, end: initialStart, direction: -1 }
        ].map((side) => {
          const cap = createBambooCutFace(THREE, bambooRadius, cutFaceMaterial, side.position);
          cap.visible = false;
          bamboo.add(cap);

          const offcut = new THREE.Group();
          const offcutBody = new THREE.Mesh(
            new THREE.TubeGeometry(
              new THREE.LineCurve3(
                new THREE.Vector3(side.position, 0, 0),
                new THREE.Vector3(side.end, 0, 0)
              ),
              8, bambooRadius, 16, false
            ),
            bambooBody.material
          );
          offcutBody.castShadow = true;
          offcutBody.receiveShadow = true;
          offcut.add(offcutBody);
          offcut.add(bambooEnds[side.endIndex].clone());
          const offcutCap = cap.clone();
          offcutCap.visible = true;
          offcut.add(offcutCap);
          offcut.visible = false;
          bamboo.add(offcut);
          return { ...side, cap, offcut };
        });

        function setBambooRange(start, end) {
          bambooBody.geometry.dispose();
          bambooBody.geometry = createBambooBodyGeometry(THREE, start, end, bambooRadius);
        }

        const cameraStartPosition = new THREE.Vector3(0, 6.75, 10.8);
        const cameraStartTarget = new THREE.Vector3(0, 1.05, 0);
        const cameraFocusTarget = new THREE.Vector3(
          bamboo.position.x + cutPosition - workOffset.x,
          bambooRestY,
          bamboo.position.z - workOffset.z
        );
        const cameraFocusPosition = cameraFocusTarget.clone().add(new THREE.Vector3(3, 0.42, 0.22));
        const cameraLeftTarget = new THREE.Vector3(
          2 * bamboo.position.x - cameraFocusTarget.x,
          cameraFocusTarget.y,
          2 * bamboo.position.z - cameraFocusTarget.z
        );
        const cameraFocusOffset = cameraFocusPosition.clone().sub(cameraFocusTarget);
        const transitionOffset = new THREE.Vector3();
        const cameraTarget = cameraStartTarget.clone();
        camera.position.copy(cameraStartPosition);
        camera.lookAt(cameraTarget);

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.lookAt(cameraTarget);
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
          if (phase === "playing") positionTimingGame();
        }

        let currentSide = 0;
        let phase = "intro";
        let failedAttempts = 0;
        let timingStartedAt = 0;
        let cutStartedAt = 0;
        let transitionStartedAt = 0;
        let cutApplied = false;
        let idleTimer = 0;
        const introStartedAt = performance.now();
        const timingPosition = new THREE.Vector3();
        const boardBounds = new THREE.Box3();
        const intro = document.querySelector(".intro");
        const isMobile = navigator.userAgentData
          ? navigator.userAgentData.mobile
          : /Android.*Mobile|iPhone|iPod|IEMobile|Opera Mini/i.test(navigator.userAgent);
        timingGame.classList.toggle("is-mobile", isMobile);

        function positionTimingGame() {
          if (isMobile) {
            const size = Math.min(host.clientWidth * 0.35, host.clientHeight * 0.3);
            timingGame.style.width = `${size}px`;
            timingGame.style.height = `${size}px`;
            timingGame.style.left = `${host.clientWidth * 0.24}px`;
            timingGame.style.top = `${host.clientHeight * 0.43}px`;
            return;
          }
          camera.updateMatrixWorld();
          boardBounds.setFromObject(doma);
          let boardTop = host.clientHeight;
          for (const xCorner of [boardBounds.min.x, boardBounds.max.x]) {
            for (const yCorner of [boardBounds.min.y, boardBounds.max.y]) {
              for (const zCorner of [boardBounds.min.z, boardBounds.max.z]) {
                timingPosition.set(xCorner, yCorner, zCorner).project(camera);
                boardTop = Math.min(boardTop, (1 - timingPosition.y) * host.clientHeight / 2);
              }
            }
          }
          const isPortraitMobile = host.clientWidth <= 620 && host.clientHeight > host.clientWidth;
          const introClearance = isPortraitMobile
            ? intro.getBoundingClientRect().bottom + 32
            : 42;
          const size = Math.min(
            150,
            Math.max(isPortraitMobile ? 50 : 40, boardTop - 12 - introClearance),
            (host.clientWidth - 16) / 1.5,
            (host.clientHeight - introClearance) / 1.5
          );
          timingGame.style.width = `${size}px`;
          timingGame.style.height = `${size}px`;
          timingGame.style.left = `${host.clientWidth / 2}px`;
          timingGame.style.top = `${Math.max(size + introClearance, boardTop - 12)}px`;
        }

        // Allocate more of each half-cycle to angles near the target.
        const timingSteps = 256;
        const timingWeights = [0];
        for (let step = 0; step < timingSteps; step += 1) {
          const angle = Math.PI * (step + 0.5) / timingSteps;
          const radius = 11 + 20 * (1 - Math.cos(angle));
          const entering = THREE.MathUtils.smoothstep(radius, innerRadius - 6, innerRadius);
          const leaving = 1 - THREE.MathUtils.smoothstep(radius, outerRadius, outerRadius + 6);
          timingWeights.push(timingWeights[step] + 1 + 1.2 * entering * leaving);
        }

        function timingRadius(timestamp) {
          const cycle = ((timestamp - timingStartedAt) % 4500) / 2250;
          const progress = cycle <= 1 ? cycle : 2 - cycle;
          const targetWeight = progress * timingWeights[timingSteps];
          let lower = 0;
          let upper = timingSteps;
          while (upper - lower > 1) {
            const middle = Math.floor((lower + upper) / 2);
            if (timingWeights[middle] < targetWeight) lower = middle;
            else upper = middle;
          }
          const fraction = (targetWeight - timingWeights[lower])
            / (timingWeights[upper] - timingWeights[lower]);
          const angle = Math.PI * (lower + fraction) / timingSteps;
          return 11 + 20 * (1 - Math.cos(angle));
        }

        function easeInOut(value) {
          const progress = THREE.MathUtils.clamp(value, 0, 1);
          return progress * progress * (3 - 2 * progress);
        }

        function updateIntro(timestamp) {
          const elapsed = (timestamp - introStartedAt) / 1000;
          const cameraProgress = easeInOut(elapsed / 1.4);
          camera.position.lerpVectors(cameraStartPosition, cameraFocusPosition, cameraProgress);
          cameraTarget.lerpVectors(cameraStartTarget, cameraFocusTarget, cameraProgress);
          camera.lookAt(cameraTarget);

          const boardProgress = easeInOut((elapsed - 0.2) / 0.9);
          const boardScale = THREE.MathUtils.lerp(domaStartScale, 1, boardProgress);
          doma.scale.set(boardScale, 1, boardScale);

          if (elapsed >= 2.15) {
            doma.scale.set(1, 1, 1);
            camera.position.copy(cameraFocusPosition);
            cameraTarget.copy(cameraFocusTarget);
            camera.lookAt(cameraTarget);
            startTiming(timestamp);
          }
        }

        function startTiming(timestamp) {
          phase = "playing";
          failedAttempts = 0;
          timingStartedAt = timestamp;
          cutHelp.hidden = true;
          timingTarget.classList.remove("is-shaking");
          timingRing.setAttribute("r", "11");
          cutMarker.position.x = sides[currentSide].position;
          cutMarker.visible = true;
          cutSide.textContent = `${sides[currentSide].name} 끝을 재단하세요`;
          timingButton.setAttribute("aria-label", `타이밍에 맞춰 ${sides[currentSide].name} 대나무 재단`);
          timingGame.hidden = false;
          instruction.textContent = "실선이 두 점선 사이에 들어오면 원을 눌러주세요.";
          positionTimingGame();
          resetIdleTimer();
        }

        function resetIdleTimer() {
          if (phase !== "playing" || !cutHelp.hidden) return;
          window.clearTimeout(idleTimer);
          idleTimer = window.setTimeout(() => {
            if (phase !== "playing") return;
            cutHelp.hidden = false;
            instruction.textContent = "다시 시도하거나 도움받기로 재단할 수 있어요.";
            positionTimingGame();
          }, 6000);
        }

        function startCut() {
          if (phase !== "playing") return;
          phase = "cutting";
          cutStartedAt = performance.now();
          cutApplied = false;
          window.clearTimeout(idleTimer);
          timingGame.hidden = true;
          cutHelp.hidden = true;
          instruction.textContent = "대나무를 재단하고 있어요.";
        }

        function applyCut() {
          const side = sides[currentSide];
          setBambooRange(currentSide === 0 ? initialStart : side.position, sides[0].position);
          bambooEnds[side.endIndex].visible = false;
          side.cap.visible = true;
          cutMarker.visible = false;
          side.offcut.visible = true;
          cutApplied = true;
        }

        function updateCut(timestamp) {
          const elapsed = timestamp - cutStartedAt;
          let offset;
          if (elapsed < 420) {
            offset = 0.27 * easeInOut(elapsed / 420);
          } else if (elapsed < 560) {
            offset = THREE.MathUtils.lerp(0.27, -0.095, easeInOut((elapsed - 420) / 140));
          } else {
            if (!cutApplied) applyCut();
            offset = THREE.MathUtils.lerp(-0.095, 0, easeInOut((elapsed - 560) / 300));
            sides[currentSide].offcut.position.x = sides[currentSide].direction
              * 0.16 * easeInOut((elapsed - 560) / 400);
          }
          knife.position.copy(currentSide === 0 ? knifeRestPosition : knifeLeftPosition);
          knife.position.y += offset;
          if (elapsed < 1300) return;

          if (currentSide === 0) {
            phase = "transition";
            transitionStartedAt = timestamp;
            instruction.textContent = "반대쪽으로 이동하고 있어요.";
            cutSide.textContent = "왼쪽 끝으로 이동 중";
            return;
          }
          phase = "complete";
          instruction.textContent = "대나무 양쪽을 재단했습니다.";
          cutSide.textContent = "양쪽 재단 완료";
          completionScreen.classList.add("is-visible");
        }

        function updateTransition(timestamp) {
          const progress = easeInOut((timestamp - transitionStartedAt) / 1700);
          cameraTarget.lerpVectors(cameraFocusTarget, cameraLeftTarget, progress);
          transitionOffset.copy(cameraFocusOffset).applyAxisAngle(up, Math.PI * progress);
          camera.position.copy(cameraTarget).add(transitionOffset);
          camera.lookAt(cameraTarget);
          knife.position.lerpVectors(knifeRestPosition, knifeLeftPosition, progress);
          knife.position.y += 0.27 * Math.sin(Math.PI * progress);
          knife.quaternion.slerpQuaternions(knifeRestRotation, knifeLeftRotation, progress);
          if (progress < 1) return;
          currentSide = 1;
          startTiming(timestamp);
        }

        function resetStage() {
          currentSide = 0;
          setBambooRange(initialStart, initialEnd);
          for (const end of bambooEnds) end.visible = true;
          for (const side of sides) {
            side.cap.visible = false;
            side.offcut.visible = false;
            side.offcut.position.x = 0;
          }
          knife.position.copy(knifeRestPosition);
          knife.quaternion.copy(knifeRestRotation);
          camera.position.copy(cameraFocusPosition);
          cameraTarget.copy(cameraFocusTarget);
          camera.lookAt(cameraTarget);
          completionScreen.classList.remove("is-visible");
          startTiming(performance.now());
        }

        timingButton.addEventListener("click", () => {
          if (phase !== "playing") return;
          const radius = Number(timingRing.getAttribute("r"));
          if (radius >= innerRadius && radius <= outerRadius) {
            startCut();
            return;
          }
          failedAttempts += 1;
          timingTarget.classList.remove("is-shaking");
          void timingTarget.getBoundingClientRect();
          timingTarget.classList.add("is-shaking");
          if (failedAttempts >= 2) cutHelp.hidden = false;
          instruction.textContent = cutHelp.hidden
            ? "아쉬워요. 실선이 점선 사이에 들어오면 다시 눌러주세요."
            : "다시 시도하거나 도움받기로 재단할 수 있어요.";
          positionTimingGame();
        });

        cutHelp.addEventListener("click", startCut);
        for (const eventName of ["pointermove", "pointerdown", "keydown", "wheel"]) {
          window.addEventListener(eventName, resetIdleTimer, { passive: true });
        }
        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage4.html";
        });

        window.addEventListener("resize", resize);
        resize();
        instruction.textContent = "도마를 준비하고 있습니다.";
        renderer.setAnimationLoop((timestamp) => {
          if (phase === "intro") updateIntro(timestamp);
          if (phase === "playing") timingRing.setAttribute("r", String(timingRadius(timestamp)));
          if (phase === "cutting") updateCut(timestamp);
          if (phase === "transition") updateTransition(timestamp);
          renderer.render(scene, camera);
        });
        announceStageReady();
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the cutting stage could not start.", error);
      errorScreen.classList.add("is-visible");
      announceStageReady();
    });
  </script>
</body>
</html>
