<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>대나무 공방 - 9단계 오늬 다듬기</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f2ead8;
      --gold: #d7ad6c;
      --panel: rgba(25, 34, 31, .88);
      --line: rgba(232, 214, 174, .18);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #17211e;
      color: var(--ink);
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }

    button { font: inherit; }
    #scene { position: fixed; inset: 0; z-index: 0; }
    #scene canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(13, 20, 18, .83) 0%, rgba(13, 20, 18, .5) 31%, transparent 62%),
        linear-gradient(0deg, rgba(11, 17, 15, .76), transparent 36%, rgba(11, 17, 15, .26));
    }
    #interface { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    .topbar {
      position: absolute;
      top: 26px;
      left: clamp(24px, 4.2vw, 66px);
      right: clamp(24px, 4.2vw, 66px);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark {
      display: grid;
      width: 39px;
      height: 39px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: var(--gold);
      font-family: Georgia, serif;
      font-size: 19px;
    }
    .brand-copy { display: grid; gap: 3px; }
    .brand-copy small { color: var(--gold); font-size: 9px; font-weight: 700; letter-spacing: .22em; }
    .brand-copy strong { font-size: 14px; font-weight: 600; letter-spacing: .08em; }
    .stage-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 14px 9px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(21, 29, 26, .64);
      color: #e8dfcc;
      font-size: 12px;
      backdrop-filter: blur(12px);
    }
    .stage-chip b {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      border-radius: 50%;
      background: var(--gold);
      color: #20231c;
      font: 12px Georgia, serif;
    }
    .intro {
      position: absolute;
      top: clamp(145px, 25vh, 220px);
      left: clamp(44px, 7vw, 112px);
      width: min(480px, 40vw);
    }
    .eyebrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 0 0 19px;
      color: var(--gold);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .2em;
    }
    .eyebrow::before { width: 24px; height: 1px; background: var(--gold); content: ""; }
    h1 {
      margin: 0;
      font-family: "Batang", "Nanum Myeongjo", "Malgun Gothic", serif;
      font-size: clamp(34px, 3.5vw, 49px);
      font-weight: 500;
      letter-spacing: -.08em;
      line-height: 1.35;
      text-shadow: 0 3px 24px rgba(0, 0, 0, .35);
    }
    h1 em { color: #d9c294; font-style: normal; }
    #instruction {
      min-height: 48px;
      margin: 18px 0 0;
      color: #c7c7b8;
      font-size: 13px;
      letter-spacing: -.025em;
      line-height: 1.8;
      word-break: keep-all;
    }
    .gesture-note { display: flex; align-items: center; gap: 11px; margin-top: 24px; color: #a7ad9e; font-size: 11px; }
    .cut-icon {
      display: grid;
      width: 31px;
      height: 31px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .6);
      border-radius: 50%;
      color: var(--gold);
      font-size: 14px;
    }
    .bottom-area { position: absolute; right: 24px; bottom: 30px; left: 24px; display: flex; justify-content: center; }
    .progress-card {
      width: min(520px, 100%);
      padding: 17px 21px 15px;
      border: 1px solid rgba(221, 204, 163, .22);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: 0 18px 55px rgba(0, 0, 0, .28);
      backdrop-filter: blur(16px);
    }
    .progress-head, .progress-label { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .progress-title { display: flex; align-items: center; gap: 9px; color: #e5dfce; font-size: 12px; font-weight: 600; }
    .progress-mark {
      display: grid;
      width: 21px;
      height: 21px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .45);
      border-radius: 50%;
      color: var(--gold);
      font: 11px Georgia, serif;
    }
    #progress-value { color: #f1d5a5; font: 19px Georgia, serif; }
    .progress-track { height: 7px; margin: 12px 0 10px; overflow: hidden; border-radius: 8px; background: rgba(231, 220, 191, .12); }
    #progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #849e6d, #d2ae6b);
      box-shadow: 0 0 14px rgba(212, 174, 105, .35);
      transition: width .2s ease;
    }
    .progress-label { color: #aeb3a4; font-size: 10px; letter-spacing: .02em; }
    #progress-state { color: #d4bd8e; white-space: nowrap; }
    #complete-screen {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(10, 16, 14, .38);
      opacity: 0;
      visibility: hidden;
      transition: opacity .3s, visibility .3s;
      pointer-events: none;
    }
    #complete-screen.is-visible { opacity: 1; visibility: visible; pointer-events: auto; }
    .complete-card {
      width: min(435px, 100%);
      padding: 36px 34px 30px;
      border: 1px solid rgba(226, 202, 152, .34);
      border-radius: 20px;
      background: rgba(26, 35, 31, .96);
      box-shadow: 0 25px 90px rgba(0, 0, 0, .45);
      text-align: center;
      backdrop-filter: blur(18px);
      transform: translateY(12px) scale(.98);
      transition: transform .35s;
    }
    #complete-screen.is-visible .complete-card { transform: translateY(0) scale(1); }
    .complete-seal {
      display: grid;
      width: 51px;
      height: 51px;
      margin: 0 auto 17px;
      place-items: center;
      border: 1px solid rgba(215, 173, 108, .65);
      border-radius: 50%;
      color: #ecd09b;
      font-size: 22px;
    }
    .complete-kicker { margin: 0 0 9px; color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .2em; }
    .complete-card h2 { margin: 0; font: 500 31px "Batang", "Nanum Myeongjo", serif; letter-spacing: -.06em; }
    .complete-copy { margin: 12px 0 25px; color: #b8bbae; font-size: 12px; line-height: 1.8; }
    .complete-actions { display: grid; grid-template-columns: 1fr 1.15fr; gap: 9px; }
    .action-button {
      min-height: 44px;
      padding: 0 13px;
      border: 1px solid rgba(231, 215, 180, .24);
      border-radius: 9px;
      background: transparent;
      color: #ded8c8;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }
    .action-button:hover { border-color: rgba(231, 215, 180, .6); background: rgba(255, 255, 255, .05); }
    .action-button.primary { border-color: #d6ad70; background: #d6ad70; color: #25271f; }
    #load-error {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: none;
      place-items: center;
      padding: 24px;
      background: #17211e;
      color: #f2ead8;
      text-align: center;
    }
    #load-error.is-visible { display: grid; }
  </style>
</head>
<body>
  <div id="scene" aria-label="오늬를 깎아 활시위가 걸릴 홈을 만드는 3D 작업대"></div>
  <div class="vignette" aria-hidden="true"></div>
  <main id="interface">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">竹</div>
        <div class="brand-copy"><small>HANDCRAFT WORKSHOP</small><strong>대나무 공방</strong></div>
      </div>
      <div class="stage-chip"><b>09</b><span>9단계 · 오늬 다듬기</span></div>
    </header>
    <section class="intro" aria-live="polite">
      <p class="eyebrow">STAGE 09 &nbsp; / &nbsp; SHAPING THE NOCK</p>
      <h1>오늬를 다듬어<br><em>활시위 자리를 만드세요</em></h1>
      <p id="instruction">누워 있는 화살을 클릭해 오늬를 확대하세요.</p>
      <div class="gesture-note"><span class="cut-icon" aria-hidden="true">⌁</span><span>가이드 안을 드래그해 조금씩 깎아주세요</span></div>
    </section>
    <section class="bottom-area" aria-live="polite">
      <div class="progress-card">
        <div class="progress-head">
          <div class="progress-title"><span class="progress-mark" aria-hidden="true">Ⅸ</span><span>오늬 다듬기</span></div>
          <strong id="progress-value">0%</strong>
        </div>
        <div class="progress-track" role="progressbar" aria-label="오늬 다듬기 진행도" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div id="progress-fill"></div>
        </div>
        <div class="progress-label"><span id="progress-hint">화살을 클릭해 오늬를 확대하세요</span><span id="progress-state">준비</span></div>
      </div>
    </section>
    <section id="complete-screen" aria-modal="true" role="dialog" aria-labelledby="complete-title">
      <div class="complete-card">
        <div class="complete-seal" aria-hidden="true">✓</div>
        <p class="complete-kicker">STAGE 09 COMPLETE</p>
        <h2 id="complete-title">9단계 완료</h2>
        <p class="complete-copy">오늬에 활시위가 걸릴 홈을 만들었습니다.</p>
        <div class="complete-actions">
          <button class="action-button" id="retry-button" type="button">9단계 다시하기</button>
          <button class="action-button primary" id="next-button" type="button">10단계로 넘어가기 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </section>
  </main>
  <div id="load-error" role="alert">3D 장면을 불러오지 못했습니다. 인터넷 연결을 확인한 뒤 새로고침해주세요.</div>
  <script type="module">
    const errorScreen = document.getElementById("load-error");
    import("https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js").then((THREE) => {
      (() => {
        "use strict";
        const host = document.getElementById("scene");
        const instruction = document.getElementById("instruction");
        const progressValue = document.getElementById("progress-value");
        const progressFill = document.getElementById("progress-fill");
        const progressTrack = document.querySelector(".progress-track");
        const progressHint = document.getElementById("progress-hint");
        const progressState = document.getElementById("progress-state");
        const completionScreen = document.getElementById("complete-screen");

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x17211e);
        scene.fog = new THREE.Fog(0x17211e, 17, 32);
        const camera = new THREE.PerspectiveCamera(36, 1, 0.1, 80);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        host.appendChild(renderer.domElement);

        scene.add(new THREE.HemisphereLight(0xe4ddc5, 0x263732, 1.7));
        const keyLight = new THREE.DirectionalLight(0xffd8a0, 3.1);
        keyLight.position.set(-4.5, 9, 6);
        keyLight.castShadow = true;
        keyLight.shadow.mapSize.set(2048, 2048);
        scene.add(keyLight);
        const fillLight = new THREE.PointLight(0x8eaa8b, 22, 17, 2);
        fillLight.position.set(-4, 4, -2);
        scene.add(fillLight);

        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(80, 80),
          new THREE.MeshStandardMaterial({ color: 0x18231f, roughness: 0.96 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.78;
        ground.receiveShadow = true;
        scene.add(ground);
        const table = new THREE.Group();
        scene.add(table);
        const tableColors = [0x624a32, 0x705238, 0x664a30, 0x76583b, 0x624831];
        for (let index = 0; index < tableColors.length; index += 1) {
          const plank = new THREE.Mesh(
            new THREE.BoxGeometry(9.7, 0.2, 0.97),
            new THREE.MeshStandardMaterial({ color: tableColors[index], roughness: 0.83 })
          );
          plank.position.set(0, 0.46, -1.94 + index * 0.97);
          plank.receiveShadow = true;
          table.add(plank);
        }
        const legMaterial = new THREE.MeshStandardMaterial({ color: 0x493723, roughness: 0.84 });
        for (const x of [-4.18, 4.18]) {
          for (const z of [-2.05, 2.05]) {
            const leg = new THREE.Mesh(new THREE.BoxGeometry(0.23, 1.15, 0.23), legMaterial);
            leg.position.set(x, -0.115, z);
            table.add(leg);
          }
        }

        const tableTop = 0.56;
        const bambooLength = 3.5;
        const cutLength = bambooLength / 12;
        const bambooStart = -bambooLength / 2 + cutLength;
        const bambooEnd = bambooLength / 2 - cutLength;
        const shaftLength = bambooEnd - bambooStart;
        const shaftRadius = 0.044;
        const nockLength = shaftLength / 10;
        const inkBandWidth = 0.045;
        const inkCenters = [0.24, shaftLength - 0.24];
        const arrow = new THREE.Group();
        arrow.position.set(-1.25, tableTop + 0.0575, 0.45);
        const laidQuaternion = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0, 0, 1), -Math.PI / 2);
        const uprightQuaternion = new THREE.Quaternion();
        arrow.quaternion.copy(laidQuaternion);
        scene.add(arrow);

        const bambooMaterial = new THREE.MeshStandardMaterial({ color: 0x8eaa67, roughness: 0.48, metalness: 0.02 });
        const glueMaterial = new THREE.MeshStandardMaterial({ color: 0x89502d, roughness: 0.72 });
        const inkMaterial = new THREE.MeshStandardMaterial({ color: 0x12130f, roughness: 0.88 });
        const shaft = new THREE.Mesh(new THREE.CylinderGeometry(shaftRadius, shaftRadius, shaftLength, 32, 1), bambooMaterial);
        shaft.position.y = shaftLength / 2;
        shaft.castShadow = true;
        shaft.receiveShadow = true;
        arrow.add(shaft);
        const roundedTip = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        roundedTip.position.y = 0;
        roundedTip.castShadow = true;
        arrow.add(roundedTip);
        const roundedNockEnd = new THREE.Mesh(new THREE.SphereGeometry(shaftRadius, 18, 12), glueMaterial);
        roundedNockEnd.position.y = shaftLength;
        roundedNockEnd.visible = false;
        arrow.add(roundedNockEnd);
        for (const [start, end] of [
          [0, inkCenters[0] - inkBandWidth / 2],
          [inkCenters[1] + inkBandWidth / 2, shaftLength]
        ]) {
          const coating = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, end - start, 32, 1),
            glueMaterial
          );
          coating.position.y = (start + end) / 2;
          coating.castShadow = true;
          arrow.add(coating);
        }
        for (const y of inkCenters) {
          const band = new THREE.Mesh(
            new THREE.CylinderGeometry(0.045, 0.045, inkBandWidth, 24, 1),
            inkMaterial
          );
          band.position.y = y;
          arrow.add(band);
        }

        const threadMaterial = new THREE.MeshStandardMaterial({ color: 0xf3efe4, roughness: 0.68, metalness: 0.02 });
        for (const [start, end] of [
          [0, inkCenters[0] - inkBandWidth / 2],
          [inkCenters[1] + inkBandWidth / 2, shaftLength]
        ]) {
          const points = [];
          for (let index = 0; index <= 128; index += 1) {
            const amount = index / 128;
            const angle = amount * 4 * Math.PI * 2;
            points.push(new THREE.Vector3(
              Math.sin(angle) * 0.0515,
              start + (end - start) * amount,
              Math.cos(angle) * 0.0515
            ));
          }
          const thread = new THREE.Mesh(
            new THREE.TubeGeometry(new THREE.CatmullRomCurve3(points), 128, 0.006, 8, false),
            threadMaterial
          );
          thread.castShadow = true;
          thread.receiveShadow = true;
          arrow.add(thread);
        }

        const nockCenterY = shaftLength + nockLength / 2 - 0.08;
        const nockGroup = new THREE.Group();
        nockGroup.position.y = nockCenterY;
        arrow.add(nockGroup);
        const nockMaterial = new THREE.MeshStandardMaterial({
          color: 0xd8c18d,
          roughness: 0.76,
          side: THREE.DoubleSide
        });
        const nockBody = new THREE.Mesh(new THREE.BufferGeometry(), nockMaterial);
        nockBody.castShadow = true;
        nockBody.receiveShadow = true;
        nockGroup.add(nockBody);
        const nockGlue = new THREE.Mesh(
          new THREE.CylinderGeometry(0.045, 0.045, nockLength / 2, 24, 1),
          glueMaterial
        );
        nockGlue.position.y = -nockLength / 4;
        nockGlue.castShadow = true;
        nockGroup.add(nockGlue);

        const cutWidth = 0.05;
        const cutDepth = 0.095;
        const nockTop = nockLength / 2;
        const guideBottom = nockTop - cutDepth;
        const nockTopCap = new THREE.Mesh(new THREE.BufferGeometry(), nockMaterial);
        nockTopCap.receiveShadow = true;
        nockGroup.add(nockTopCap);
        const nockBottomCap = new THREE.Mesh(
          new THREE.CircleGeometry(shaftRadius, 64),
          nockMaterial
        );
        nockBottomCap.rotation.x = Math.PI / 2;
        nockBottomCap.position.y = -nockLength / 2;
        nockGroup.add(nockBottomCap);
        const guideGroup = new THREE.Group();
        guideGroup.position.z = shaftRadius + 0.003;
        guideGroup.visible = false;
        nockGroup.add(guideGroup);
        const guideMaterial = new THREE.MeshBasicMaterial({ color: 0xf0c77d, transparent: true, opacity: 0.95 });
        function surfaceOffset(x) {
          return Math.sqrt(Math.max(0, shaftRadius * shaftRadius - x * x)) - shaftRadius;
        }
        function addGuideStroke(startX, startY, endX, endY) {
          const points = [];
          for (let step = 0; step <= 8; step += 1) {
            const amount = step / 8;
            const x = THREE.MathUtils.lerp(startX, endX, amount);
            const y = THREE.MathUtils.lerp(startY, endY, amount);
            points.push(new THREE.Vector3(x, y, surfaceOffset(x)));
          }
          const path = new THREE.CatmullRomCurve3(points);
          const line = new THREE.Mesh(new THREE.TubeGeometry(path, 16, 0.0025, 6, false), guideMaterial);
          guideGroup.add(line);
        }
        addGuideStroke(-cutWidth / 2, nockTop, -cutWidth / 2, guideBottom);
        addGuideStroke(cutWidth / 2, nockTop, cutWidth / 2, guideBottom);
        addGuideStroke(-cutWidth / 2, guideBottom, cutWidth / 2, guideBottom);

        const cutMaterial = new THREE.MeshStandardMaterial({
          color: 0xb69b69,
          roughness: 0.9,
          side: THREE.DoubleSide
        });
        const cutSideWalls = new THREE.Mesh(new THREE.BufferGeometry(), cutMaterial);
        const cutFloor = new THREE.Mesh(new THREE.BufferGeometry(), cutMaterial);
        for (const cutFace of [cutSideWalls, cutFloor]) {
          cutFace.castShadow = true;
          cutFace.receiveShadow = true;
          nockGroup.add(cutFace);
        }
        const guideHitMaterial = new THREE.MeshBasicMaterial({
          transparent: true,
          opacity: 0,
          colorWrite: false,
          depthWrite: false,
          side: THREE.DoubleSide
        });
        const guideHit = new THREE.Mesh(new THREE.PlaneGeometry(cutWidth + 0.08, cutDepth + 0.08), guideHitMaterial);
        guideHit.position.set(0, nockTop - cutDepth / 2, shaftRadius + 0.006);
        nockGroup.add(guideHit);

        const laidCameraPosition = new THREE.Vector3(0, 4.5, 8.8);
        const laidCameraTarget = new THREE.Vector3(0, 0.95, 0);
        const closeCameraTarget = new THREE.Vector3(arrow.position.x, arrow.position.y + nockCenterY, arrow.position.z);
        const closeCameraPosition = closeCameraTarget.clone().add(new THREE.Vector3(0, 0.28, 1.75));
        const cameraTarget = laidCameraTarget.clone();
        camera.position.copy(laidCameraPosition);
        camera.lookAt(cameraTarget);
        const raycaster = new THREE.Raycaster();
        const pointer = new THREE.Vector2();
        let phase = "laid";
        let carveProgress = 0;
        let animationStartedAt = 0;
        let turnTimeout = 0;
        let isDragging = false;
        let wasInsideGuide = false;
        let lastCarveX = 0;
        let lastCarveY = 0;

        function resize() {
          const width = Math.max(1, host.clientWidth);
          const height = Math.max(1, host.clientHeight);
          camera.aspect = width / height;
          camera.updateProjectionMatrix();
          renderer.setSize(width, height, false);
        }

        function updateProgress() {
          const percent = Math.round(carveProgress * 100);
          progressValue.textContent = `${percent}%`;
          progressFill.style.width = `${percent}%`;
          progressTrack.setAttribute("aria-valuenow", String(percent));
          if (phase === "laid") {
            instruction.textContent = "누워 있는 화살을 클릭해 오늬를 확대하세요.";
            progressHint.textContent = "화살을 클릭해 오늬를 확대하세요";
            progressState.textContent = "준비";
          } else if (phase === "turning") {
            instruction.textContent = "화살을 세워 오늬를 가까이 보여드립니다.";
            progressHint.textContent = "오늬를 확대하는 중";
            progressState.textContent = "확대 중";
          } else if (phase === "carving") {
            instruction.textContent = "가이드 안을 드래그해 오늬를 조금씩 깎아주세요.";
            progressHint.textContent = "윗부분이 열린 홈을 만드는 중";
            progressState.textContent = "다듬기 중";
          } else {
            instruction.textContent = "활시위가 걸릴 오늬 홈이 완성됐습니다.";
            progressHint.textContent = "오늬 다듬기 완료";
            progressState.textContent = "완료";
          }
        }

        function updateCutSurface() {
          const progress = carveProgress;
          const depth = cutDepth * progress;
          const width = cutWidth * Math.min(1, progress * 1.6);
          const yBottom = -nockLength / 2;
          const yNotchBottom = nockTop - depth;
          const halfWidth = Math.min(width / 2, shaftRadius * 0.98);
          const halfAngle = progress > 0 ? Math.asin(halfWidth / shaftRadius) : 0;
          const zEdge = Math.sqrt(Math.max(0, shaftRadius * shaftRadius - halfWidth * halfWidth));

          function replaceGeometry(mesh, geometry) {
            mesh.geometry.dispose();
            mesh.geometry = geometry;
          }

          function makeGeometry(vertices, indices) {
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute("position", new THREE.Float32BufferAttribute(vertices, 3));
            geometry.setIndex(indices);
            geometry.computeVertexNormals();
            return geometry;
          }

          function makeTopCap() {
            if (progress === 0) {
              const geometry = new THREE.CircleGeometry(shaftRadius, 64);
              const positions = geometry.attributes.position;
              for (let index = 0; index < positions.count; index += 1) {
                positions.setXYZ(index, positions.getX(index), nockTop, -positions.getY(index));
              }
              geometry.computeVertexNormals();
              return geometry;
            }

            const vertices = [];
            const indices = [];
            function addCap(startAngle, endAngle, centerX) {
              const centerIndex = vertices.length / 3;
              vertices.push(centerX, nockTop, 0);
              const arcSegments = 64;
              for (let index = 0; index <= arcSegments; index += 1) {
                const angle = startAngle + (endAngle - startAngle) * index / arcSegments;
                vertices.push(
                  shaftRadius * Math.sin(angle),
                  nockTop,
                  shaftRadius * Math.cos(angle)
                );
              }
              for (let index = 0; index < arcSegments; index += 1) {
                indices.push(centerIndex, centerIndex + index + 1, centerIndex + index + 2);
              }
              indices.push(centerIndex, centerIndex + arcSegments + 1, centerIndex + 1);
            }
            addCap(
              Math.PI + halfAngle,
              Math.PI * 2 - halfAngle,
              -(shaftRadius + halfWidth) / 2
            );
            addCap(
              halfAngle,
              Math.PI - halfAngle,
              (shaftRadius + halfWidth) / 2
            );
            return makeGeometry(vertices, indices);
          }

          if (progress === 0) {
            replaceGeometry(
              nockBody,
              new THREE.CylinderGeometry(shaftRadius, shaftRadius, nockLength, 96, 1, true)
            );
            replaceGeometry(nockTopCap, makeTopCap());
            for (const cutFace of [cutSideWalls, cutFloor]) cutFace.visible = false;
            return;
          }

          const angles = [];
          for (let index = 0; index <= 96; index += 1) {
            angles.push(-Math.PI + Math.PI * 2 * index / 96);
          }
          angles.push(-Math.PI + halfAngle, -halfAngle, halfAngle, Math.PI - halfAngle);
          angles.sort((first, second) => first - second);
          const uniqueAngles = angles.filter((angle, index) =>
            index === 0 || Math.abs(angle - angles[index - 1]) > 1e-7
          );
          const vertices = [];
          const indices = [];
          for (const angle of uniqueAngles) {
            const x = shaftRadius * Math.sin(angle);
            const z = shaftRadius * Math.cos(angle);
            vertices.push(x, yBottom, z, x, yNotchBottom, z, x, nockTop, z);
          }
          for (let segment = 0; segment < uniqueAngles.length - 1; segment += 1) {
            const middleAngle = (uniqueAngles[segment] + uniqueAngles[segment + 1]) / 2;
            for (let band = 0; band < 2; band += 1) {
              if (band === 1 && Math.abs(shaftRadius * Math.sin(middleAngle)) < halfWidth) continue;
              const lowerStart = segment * 3 + band;
              const lowerEnd = (segment + 1) * 3 + band;
              const upperEnd = lowerEnd + 1;
              const upperStart = lowerStart + 1;
              indices.push(lowerStart, lowerEnd, upperEnd, lowerStart, upperEnd, upperStart);
            }
          }
          replaceGeometry(nockBody, makeGeometry(vertices, indices));
          replaceGeometry(nockTopCap, makeTopCap());

          const wallVertices = [];
          const wallIndices = [];
          function addWall(points) {
            const start = wallVertices.length / 3;
            for (const point of points) wallVertices.push(point[0], point[1], point[2]);
            wallIndices.push(start, start + 1, start + 2, start, start + 2, start + 3);
          }
          addWall([
            [-halfWidth, yNotchBottom, -zEdge],
            [-halfWidth, yNotchBottom, zEdge],
            [-halfWidth, nockTop, zEdge],
            [-halfWidth, nockTop, -zEdge]
          ]);
          addWall([
            [halfWidth, yNotchBottom, -zEdge],
            [halfWidth, yNotchBottom, zEdge],
            [halfWidth, nockTop, zEdge],
            [halfWidth, nockTop, -zEdge]
          ]);
          replaceGeometry(cutSideWalls, makeGeometry(wallVertices, wallIndices));

          const floorColumns = 20;
          const floorRows = 12;
          const floorVertices = [];
          const floorIndices = [];
          for (let row = 0; row <= floorRows; row += 1) {
            const amount = row / floorRows;
            for (let column = 0; column <= floorColumns; column += 1) {
              const x = -halfWidth + 2 * halfWidth * column / floorColumns;
              const zOuter = Math.sqrt(Math.max(0, shaftRadius * shaftRadius - x * x));
              floorVertices.push(x, yNotchBottom, zOuter * (2 * amount - 1));
            }
          }
          for (let row = 0; row < floorRows; row += 1) {
            for (let column = 0; column < floorColumns; column += 1) {
              const a = row * (floorColumns + 1) + column;
              const nextRow = a + floorColumns + 1;
              floorIndices.push(a, nextRow, nextRow + 1, a, nextRow + 1, a + 1);
            }
          }
          replaceGeometry(cutFloor, makeGeometry(floorVertices, floorIndices));
          for (const cutFace of [cutSideWalls, cutFloor]) cutFace.visible = true;
        }
        updateCutSurface();

        function updatePointer(event) {
          const rect = renderer.domElement.getBoundingClientRect();
          pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
          pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          raycaster.setFromCamera(pointer, camera);
        }

        function beginCarving() {
          window.clearTimeout(turnTimeout);
          phase = "carving";
          guideGroup.visible = true;
          nockGroup.updateMatrixWorld(true);
          camera.lookAt(cameraTarget);
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          renderer.render(scene, camera);
          updateProgress();
        }

        function finishTurning() {
          if (phase !== "turning") return;
          arrow.quaternion.copy(uprightQuaternion);
          camera.position.copy(closeCameraPosition);
          cameraTarget.copy(closeCameraTarget);
          camera.lookAt(cameraTarget);
          beginCarving();
        }

        function finishCarving() {
          if (phase !== "carving") return;
          carveProgress = 1;
          updateCutSurface();
          phase = "complete";
          isDragging = false;
          guideGroup.visible = false;
          completionScreen.classList.add("is-visible");
          updateProgress();
        }

        function resetStage() {
          phase = "laid";
          carveProgress = 0;
          isDragging = false;
          wasInsideGuide = false;
          window.clearTimeout(turnTimeout);
          arrow.position.set(-1.25, tableTop + 0.0575, 0.45);
          arrow.quaternion.copy(laidQuaternion);
          camera.position.copy(laidCameraPosition);
          cameraTarget.copy(laidCameraTarget);
          camera.lookAt(cameraTarget);
          camera.updateMatrixWorld(true);
          arrow.updateMatrixWorld(true);
          guideGroup.visible = false;
          updateCutSurface();
          completionScreen.classList.remove("is-visible");
          updateProgress();
          renderer.render(scene, camera);
          renderer.domElement.style.cursor = "default";
        }

        renderer.domElement.addEventListener("pointerdown", (event) => {
          if (event.button !== 0) return;
          updatePointer(event);
          if (phase === "laid" && raycaster.intersectObject(arrow, true).length > 0) {
            phase = "turning";
            animationStartedAt = window.performance.now();
            turnTimeout = window.setTimeout(finishTurning, 1150);
            updateProgress();
            event.preventDefault();
            return;
          }
          if (phase === "carving" && raycaster.intersectObject(guideHit, false).length > 0) {
            lastCarveX = event.clientX;
            lastCarveY = event.clientY;
            wasInsideGuide = true;
            isDragging = true;
            renderer.domElement.setPointerCapture(event.pointerId);
            renderer.domElement.style.cursor = "grabbing";
            event.preventDefault();
          }
        });

        renderer.domElement.addEventListener("pointermove", (event) => {
          updatePointer(event);
          if (isDragging && phase === "carving") {
            const inside = raycaster.intersectObject(guideHit, false).length > 0;
            if (inside && wasInsideGuide) {
              const distance = Math.hypot(event.clientX - lastCarveX, event.clientY - lastCarveY);
              carveProgress = Math.min(1, carveProgress + distance / 260);
              updateCutSurface();
              updateProgress();
              if (carveProgress >= 1) finishCarving();
            }
            lastCarveX = event.clientX;
            lastCarveY = event.clientY;
            wasInsideGuide = inside;
            event.preventDefault();
            return;
          }
          if (phase === "laid") {
            renderer.domElement.style.cursor = raycaster.intersectObject(arrow, true).length > 0 ? "pointer" : "default";
          } else if (phase === "carving") {
            renderer.domElement.style.cursor = raycaster.intersectObject(guideHit, false).length > 0 ? "grab" : "default";
          }
        });

        function finishPointer(event) {
          if (!isDragging) return;
          isDragging = false;
          wasInsideGuide = false;
          if (renderer.domElement.hasPointerCapture(event.pointerId)) {
            renderer.domElement.releasePointerCapture(event.pointerId);
          }
          renderer.domElement.style.cursor = "default";
        }
        renderer.domElement.addEventListener("pointerup", finishPointer);
        renderer.domElement.addEventListener("pointercancel", finishPointer);
        document.getElementById("retry-button").addEventListener("click", resetStage);
        document.getElementById("next-button").addEventListener("click", () => {
          window.location.href = "stage10.html";
        });
        window.addEventListener("resize", resize);
        resize();
        updateProgress();
        renderer.setAnimationLoop(() => {
          if (phase === "turning") {
            const amount = Math.min((window.performance.now() - animationStartedAt) / 1100, 1);
            const eased = 1 - Math.pow(1 - amount, 3);
            arrow.quaternion.slerpQuaternions(laidQuaternion, uprightQuaternion, eased);
            camera.position.lerpVectors(laidCameraPosition, closeCameraPosition, eased);
            cameraTarget.lerpVectors(laidCameraTarget, closeCameraTarget, eased);
            if (amount >= 1) {
              finishTurning();
            }
          }
          camera.lookAt(cameraTarget);
          renderer.render(scene, camera);
        });
      })();
    }).catch((error) => {
      console.error("Three.js failed to load; the nock-shaping stage could not start.", error);
      errorScreen.classList.add("is-visible");
    });
  </script>
</body>
