<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화로 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      color: #ece9e1;
      background: #222523;
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .info { position: absolute; top: 24px; left: 28px; pointer-events: none; }
    h1 { margin: 0 0 8px; font-size: 17px; font-weight: 600; }
    p { margin: 0; color: #b7bbb3; font-size: 13px; line-height: 1.6; }
    button {
      position: absolute; right: 24px; bottom: 24px;
      padding: 9px 14px; border: 1px solid #6f766b; border-radius: 5px;
      color: #ece9e1; background: #303630; font: inherit; font-size: 13px;
      cursor: pointer;
    }
    button:hover { background: #3d453c; }
    #error { position: absolute; left: 28px; bottom: 24px; color: #ffb6a8; }
  </style>
  <script src="./asset/hearth.js" defer></script>
  <script src="./brazierPreview.js" defer></script>
</head>
<body>
  <canvas id="preview" aria-label="화로 3D 미리보기"></canvas>
  <div class="info">
    <h1>화로 미리보기</h1>
    <p>드래그하여 회전 · 스크롤하여 확대/축소</p>
  </div>
  <button id="reset" type="button">시점 초기화</button>
  <p id="error" role="alert"></p>
</body>
</html>
