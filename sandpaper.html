<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사포 미리보기</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { overflow: hidden; background: #222523; color: #ece9e1; font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
    .info { position: absolute; top: 24px; left: 28px; pointer-events: none; }
    h1 { margin: 0 0 8px; font-size: 17px; }
    p { margin: 0; color: #b7bbb3; font-size: 13px; line-height: 1.6; }
    .controls { position: absolute; left: 28px; bottom: 24px; padding: 14px; background: #303630; border: 1px solid #6f766b; border-radius: 5px; }
    label { display: block; font-size: 13px; margin-bottom: 8px; }
    input { width: min(250px, 55vw); accent-color: #bfaa7f; vertical-align: middle; }
    .ends { display: flex; justify-content: space-between; color: #b7bbb3; font-size: 11px; margin-top: 4px; }
    button { position: absolute; right: 24px; bottom: 24px; padding: 9px 14px; border: 1px solid #6f766b; border-radius: 5px; color: #ece9e1; background: #303630; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { background: #3d453c; }
    #error { position: absolute; left: 28px; top: 85px; color: #ffb6a8; }
  </style>
  <script src="./asset/bamboo.js" defer></script>
  <script src="./asset/sapo.js" defer></script>
  <script src="./sandpaperPreview.js" defer></script>
</head>
<body>
  <canvas id="preview" aria-label="사포와 대나무 3D 미리보기"></canvas>
  <div class="info">
    <h1>사포 미리보기</h1>
    <p>대나무 중심부 확대 · 드래그하여 회전 · 스크롤하여 확대/축소</p>
  </div>
  <div class="controls">
    <label for="distance">사포와 대나무 사이 거리</label>
    <input id="distance" type="range" min="0" max="100" value="100">
    <div class="ends"><span>가까이</span><span>멀리</span></div>
  </div>
  <button id="reset" type="button">시점 초기화</button>
  <p id="error" role="alert"></p>
</body>
</html>
